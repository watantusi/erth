<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 全息地球科普介面</title>
    <!-- 引入 Tailwind CSS 进行快速样式设计 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Three.js (作為全域變數載入) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 注意：移除了 MediaPipe 的 script 标签，因为它会在 import 之前导致 'unexpected token export' 错误 -->
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Orbitron', sans-serif;
            color: #0ff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* 让鼠标事件穿透到 Canvas */
        }

        /* 摄像头预览（隐藏或小窗） */
        #webcam {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            transform: scaleX(-1); /* 镜像翻转 */
            border: 2px solid #0ff;
            border-radius: 8px;
            opacity: 0.7;
            z-index: 20;
            pointer-events: auto;
        }

        .hud-panel {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
        }

        .glowing-text {
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
        }

        /* 加载动画 */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .loader-ring {
            width: 80px;
            height: 80px;
            border: 4px solid #333;
            border-top: 4px solid #0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 扫描线效果 */
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 99;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0, 255, 255, 0.1) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
    </style>
</head>
<body>

    <!-- 加载界面 -->
    <div id="loader">
        <div class="loader-ring mb-4"></div>
        <div id="loader-text" class="text-xl tracking-widest text-cyan-400">系統初始化中...</div>
        <div class="text-xs text-gray-500 mt-2">正在載入 MediaPipe 模型與 Three.js 引擎</div>
    </div>

    <!-- UI 层 -->
    <div id="ui-layer" class="flex flex-col justify-between p-6">
        <!-- 顶部栏 -->
        <div class="flex justify-between items-start">
            <div class="hud-panel w-64">
                <h1 class="text-2xl font-bold text-cyan-400 mb-2">EARTH.HOLO</h1>
                <div class="h-px w-full bg-cyan-500 mb-2"></div>
                <p class="text-xs text-cyan-200">系統狀態: <span class="text-green-400">連線</span></p>
                <p class="text-xs text-cyan-200">手勢追蹤: <span id="tracking-status" class="text-red-400">未偵測</span></p>
                <div class="mt-4 text-[10px] text-gray-400 border-l-2 border-cyan-500 pl-2">
                    操作指南:<br>
                    1. 舉起一隻手<br>
                    2. 移動手掌旋轉地球<br>
                    3. 捏合手指查看詳情
                </div>
            </div>

            <div class="hud-panel text-right">
                <div class="text-4xl font-bold text-cyan-400 glowing-text" id="clock">00:00:00</div>
                <div class="text-xs text-cyan-300">UTC+0 系統時間</div>
            </div>
        </div>

        <!-- 中间（可选，留空给地球显示） -->

        <!-- 底部数据栏 -->
        <div class="flex justify-between items-end mb-8">
            <div class="hud-panel w-72">
                <h3 class="text-lg text-cyan-400 border-b border-cyan-800 pb-1 mb-2">行星數據</h3>
                <div class="space-y-2 text-sm text-cyan-100">
                    <div class="flex justify-between">
                        <span class="text-gray-400">赤道半徑</span>
                        <span>6,378 km</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">表面積</span>
                        <span>5.1億 km²</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">自轉速度</span>
                        <span>1,670 km/h</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">平均溫度</span>
                        <span>14.9 °C</span>
                    </div>
                    <!-- 动态数据条 -->
                    <div class="mt-2">
                        <span class="text-xs text-gray-500">大氣密度</span>
                        <div class="h-1 w-full bg-gray-800 mt-1">
                            <div class="h-full bg-cyan-500 w-[78%] animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hud-panel w-64 opacity-0 transition-opacity duration-300" id="analysis-panel">
                <h3 class="text-lg text-yellow-400 border-b border-yellow-800 pb-1 mb-2">分析模式</h3>
                <p class="text-sm text-yellow-100">
                    已鎖定目前座標。<br>
                    正在掃描地殼結構...<br>
                    <span class="text-xs text-gray-400 block mt-2">經度: <span id="geo-lng">00.00</span></span>
                    <span class="text-xs text-gray-400 block">緯度: <span id="geo-lat">00.00</span></span>
                </p>
            </div>
        </div>
    </div>

    <!-- 扫描线特效 -->
    <div class="scanline"></div>

    <!-- 摄像头视频源 (用于AI分析，视觉上缩小) -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Three.js 画布 -->
    <div id="canvas-container"></div>

    <script type="module">
        // --- 1. 初始化变量 ---
        const video = document.getElementById('webcam');
        const canvasContainer = document.getElementById('canvas-container');
        const trackingStatus = document.getElementById('tracking-status');
        const analysisPanel = document.getElementById('analysis-panel');
        const loader = document.getElementById('loader');
        
        let handLandmarker = undefined;
        let webcamRunning = false;
        let lastVideoTime = -1;
        let results = undefined;

        // Three.js 变量
        let scene, camera, renderer;
        let earthGroup, earthMesh, wireframeMesh, atmosphereMesh, cloudsMesh;
        let targetRotationX = 0;
        let targetRotationY = 0;
        let isPinching = false;

        // 颜色配置
        const COLORS = {
            base: 0x001133,
            wireframe: 0x00ffff,
            atmosphere: 0x0088ff,
            dots: 0xffffff
        };

        // --- 2. MediaPipe 设置 ---
        // 修正：确保在这里使用 import，而不是在 head 中使用 script 标签
        import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";

        const createHandLandmarker = async () => {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                );
                
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });
                
                document.getElementById('loader-text').innerText = "啟動攝影機...";
                enableCam();
            } catch (error) {
                console.error("MediaPipe Load Error:", error);
                document.getElementById('loader-text').innerText = "AI模型載入失敗";
                document.getElementById('loader-text').classList.replace('text-cyan-400', 'text-red-500');
            }
        };

        const enableCam = () => {
            if (!handLandmarker) {
                console.log("Wait! objectDetector not loaded yet.");
                return;
            }

            const constraints = { video: true };

            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    webcamRunning = true;
                    // 隐藏加载层
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                    // 启动主循环
                    predictWebcam();
                });
            }).catch(err => {
                console.error("Webcam Error:", err);
                document.getElementById('loader-text').innerText = "無法存取攝影機";
                document.getElementById('loader-text').classList.replace('text-cyan-400', 'text-red-500');
            });
        };

        // --- 3. Three.js 场景构建 ---
        function initThreeJS() {
            // 场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            // 相机
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 25;

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            canvasContainer.appendChild(renderer.domElement);

            // 光照
            const ambientLight = new THREE.AmbientLight(0x404040, 2); // 柔和的环境光
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(50, 20, 30);
            scene.add(directionalLight);
            
            const backLight = new THREE.DirectionalLight(0x0055ff, 1.0);
            backLight.position.set(-30, 10, -50);
            scene.add(backLight);

            // === 构建全息地球 ===
            earthGroup = new THREE.Group();
            scene.add(earthGroup);

            // A. 基础球体 (黑色/深蓝底色)
            const geometry = new THREE.IcosahedronGeometry(8, 2); // 2级细分，保留棱角感，像低多边形
            const material = new THREE.MeshPhongMaterial({
                color: COLORS.base,
                shininess: 20,
                flatShading: true,
                transparent: true,
                opacity: 0.9
            });
            earthMesh = new THREE.Mesh(geometry, material);
            earthGroup.add(earthMesh);

            // B. 线框层 (Holographic Grid)
            const wireframeGeo = new THREE.WireframeGeometry(geometry);
            const wireframeMat = new THREE.LineBasicMaterial({ color: COLORS.wireframe, transparent: true, opacity: 0.15 });
            wireframeMesh = new THREE.LineSegments(wireframeGeo, wireframeMat);
            earthMesh.add(wireframeMesh); // 作为子对象

            // C. 粒子点阵层 (模拟城市/数据点)
            const particlesGeo = new THREE.BufferGeometry();
            const particlesCount = 1500;
            const posArray = new Float32Array(particlesCount * 3);
            
            for(let i = 0; i < particlesCount; i++) {
                // 在球体表面随机分布
                const phi = Math.acos(-1 + (2 * i) / particlesCount);
                const theta = Math.sqrt(particlesCount * Math.PI) * phi;
                
                const r = 8.1; // 稍微高于表面
                posArray[i*3] = r * Math.cos(theta) * Math.sin(phi);
                posArray[i*3+1] = r * Math.sin(theta) * Math.sin(phi);
                posArray[i*3+2] = r * Math.cos(phi);
            }
            
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMat = new THREE.PointsMaterial({
                size: 0.08,
                color: COLORS.dots,
                transparent: true,
                opacity: 0.6
            });
            const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
            earthGroup.add(particlesMesh);

            // D. 大气光晕 (简单的缩放球体 + 背面渲染)
            const glowGeo = new THREE.IcosahedronGeometry(8, 2);
            const glowMat = new THREE.ShaderMaterial({
                uniforms: {
                    c: { type: "f", value: 0.6 },
                    p: { type: "f", value: 4.0 },
                    glowColor: { type: "c", value: new THREE.Color(COLORS.atmosphere) },
                    viewVector: { type: "v3", value: camera.position }
                },
                vertexShader: `
                    uniform vec3 viewVector;
                    varying float intensity;
                    void main() {
                        vec3 vNormal = normalize( normalMatrix * normal );
                        vec3 vNormel = normalize( normalMatrix * viewVector );
                        intensity = pow( 0.5 - dot(vNormal, vNormel), 4.0 );
                        gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
                    }
                `,
                fragmentShader: `
                    uniform vec3 glowColor;
                    varying float intensity;
                    void main() {
                        vec3 glow = glowColor * intensity;
                        gl_FragColor = vec4( glow, 1.0 );
                    }
                `,
                side: THREE.FrontSide,
                blending: THREE.AdditiveBlending,
                transparent: true
            });
            atmosphereMesh = new THREE.Mesh(glowGeo, glowMat);
            atmosphereMesh.scale.multiplyScalar(1.15);
            earthGroup.add(atmosphereMesh);

            // E. 背景星星
            const starGeo = new THREE.BufferGeometry();
            const starCount = 2000;
            const starPos = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) {
                starPos[i] = (Math.random() - 0.5) * 400;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.2, transparent: true, opacity: 0.8});
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            // 监听窗口调整
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 4. 逻辑控制循环 ---
        
        // 计算两点间距离 (用于捏合检测)
        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // 时间显示更新
        setInterval(() => {
            const now = new Date();
            const timeString = now.toISOString().split('T')[1].split('.')[0];
            document.getElementById('clock').innerText = timeString;
        }, 1000);

        async function predictWebcam() {
            // Three.js 动画循环
            requestAnimationFrame(predictWebcam);

            let nowInMs = Date.now();
            
            // 1. MediaPipe 检测
            if (webcamRunning && lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                // 增加空值检查
                if(handLandmarker) {
                    results = handLandmarker.detectForVideo(video, nowInMs);
                }
            }

            // 2. 处理手势逻辑
            if (results && results.landmarks && results.landmarks.length > 0) {
                const landmarks = results.landmarks[0]; // 获取第一只手
                
                // 更新UI状态
                trackingStatus.innerText = "已鎖定";
                trackingStatus.classList.replace('text-red-400', 'text-green-400');
                trackingStatus.classList.add('glowing-text');

                // A. 旋转控制 (使用食指指尖 index_finger_tip = 8)
                // 坐标归一化到 -1 到 1
                // 注意：Webcam 画面通常是镜像的，x 轴需要反转逻辑
                const handX = (landmarks[9].x - 0.5) * 2; // 中指根部作为手掌中心
                const handY = (landmarks[9].y - 0.5) * 2;

                // 简单的平滑过渡（Lerp）
                targetRotationY = handX * 2.5; // X轴位置控制Y轴旋转 (左右转)
                targetRotationX = handY * 1.5; // Y轴位置控制X轴旋转 (俯仰)

                // B. 捏合检测 (食指尖 8 和 拇指尖 4)
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const distance = getDistance(thumbTip, indexTip);
                
                // 距离阈值，根据经验调整
                if (distance < 0.05) {
                    isPinching = true;
                    analysisPanel.style.opacity = '1';
                    
                    // 模拟显示经纬度数据 (基于旋转值)
                    const lat = (earthGroup.rotation.x * (180/Math.PI)).toFixed(2);
                    const lng = (earthGroup.rotation.y * (180/Math.PI)).toFixed(2);
                    document.getElementById('geo-lat').innerText = lat;
                    document.getElementById('geo-lng').innerText = lng;
                    
                    // 捏合时放大地球
                    earthGroup.scale.lerp(new THREE.Vector3(1.2, 1.2, 1.2), 0.1);
                } else {
                    isPinching = false;
                    analysisPanel.style.opacity = '0';
                    earthGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                }

            } else {
                trackingStatus.innerText = "掃描中...";
                trackingStatus.classList.replace('text-green-400', 'text-red-400');
                trackingStatus.classList.remove('glowing-text');
                
                // 无手势时，缓慢自动旋转
                targetRotationY += 0.002;
            }

            // 3. 应用旋转 (平滑插值)
            // 只有在没捏合时才更新旋转，捏合时锁定视角方便查看
            if (earthGroup && !isPinching) {
                earthGroup.rotation.y += (targetRotationY - earthGroup.rotation.y) * 0.05;
                earthGroup.rotation.x += (targetRotationX - earthGroup.rotation.x) * 0.05;
            }

            // 更新大气层Shader的视角向量
            if (atmosphereMesh) {
                atmosphereMesh.material.uniforms.viewVector.value = new THREE.Vector3().subVectors(camera.position, earthGroup.position);
            }

            // 渲染
            renderer.render(scene, camera);
        }

        // --- 启动 ---
        initThreeJS();
        createHandLandmarker();

    </script>
</body>
</html>
