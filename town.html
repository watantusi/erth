<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D 互動小鎮</title>
<style>
  :root {
    --panel: rgba(255, 255, 255, 0.88);
    --text: #2b2f36;
    --muted: #6b7280;
    --accent: #ff7a59;
    --accent2: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87ceeb; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; color: var(--text); }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.15); padding: 12px 14px; z-index: 10; }
  #title { top: 12px; left: 12px; max-width: 330px; }
  #title h1 { margin: 0 0 4px; font-size: 20px; }
  #title p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
  #title .toggle-help { display: none; }
  #hud { top: 12px; right: 12px; width: 230px; display: flex; flex-direction: column; gap: 8px; }
  #hud .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #clockText { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #timeSlider { width: 100%; accent-color: var(--accent); }
  button { font: inherit; font-size: 13px; border: 0; border-radius: 10px; padding: 7px 10px; cursor: pointer; background: #eef1f5; color: var(--text); transition: transform .1s, background .2s; }
  button:hover { background: #e2e7ee; }
  button:active { transform: scale(.96); }
  button.primary { background: var(--accent); color: #fff; }
  button.primary:hover { background: #ff6640; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #stars { font-size: 15px; font-weight: 700; }
  #info { left: 12px; bottom: 12px; width: 320px; display: none; }
  #info h2 { margin: 0; font-size: 18px; }
  #info .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--accent2); color: #fff; margin: 4px 0 6px; }
  #info p { margin: 0 0 8px; font-size: 13px; line-height: 1.6; color: #444; }
  #info .stat { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  #info .btns { grid-template-columns: 1fr 1fr 40px; }
  #tip { position: fixed; pointer-events: none; z-index: 20; background: rgba(20,24,32,.85); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; display: none; white-space: nowrap; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-80px); z-index: 30; background: rgba(20,24,32,.88); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 14px; transition: transform .35s cubic-bezier(.2,1.4,.4,1); pointer-events: none; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #loader { position: fixed; inset: 0; z-index: 100; background: linear-gradient(#87ceeb, #cfeaff); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-size: 16px; transition: opacity .6s; }
  #loader .house { font-size: 54px; animation: hop 0.8s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translateY(-14px); } }
  @media (max-width: 640px) {
    #title { max-width: calc(100vw - 24px); right: 12px; padding: 10px 12px; }
    #title h1 { font-size: 17px; }
    #title p { display: none; }
    #title.open p { display: block; }
    #title .toggle-help { display: inline; font-size: 12px; color: var(--accent2); cursor: pointer; }
    #hud { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; }
    #hud .btns { grid-template-columns: repeat(4, 1fr); }
    #hud button { padding: 7px 4px; font-size: 12px; }
    #info { left: 12px; right: 12px; width: auto; bottom: auto; top: 70px; }
  }

<body>
<div id="loader"><div class="house">🏘️</div><div>小鎮建造中…</div></div>
<div id="app"></div>

<div id="title" class="panel">
  <h1>🏘️ 晴空互動小鎮 <span class="toggle-help" id="helpBtn">說明</span></h1>
  <p>🖱️ 拖曳旋轉視角、滾輪 / 雙指縮放<br>👆 點地面讓小人走過去，或用 <b>WASD / 方向鍵</b> 移動<br>🏠 點建築、🚗 汽車、🧍 路人、🌳 樹、⛲ 噴泉、⏰ 鐘塔都有反應<br>⭐ 收集小鎮裡的 12 顆星星！</p>
</div>

<div id="hud" class="panel">
  <div class="row" style="justify-content:space-between">

  <div class="btns">
    <button id="autoBtn">⏸ 暫停時間</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ */
/* 基本工具                                                            */
/* ------------------------------------------------------------------ */
let seed = 20261110;
const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const rr = (a, b) => a + rand() * (b - a);
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const PI = Math.PI;

const matCache = new Map();
function mat(color, opts) {
  if (!opts) {
    const key = String(color);
    if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
    return matCache.get(key);
  }
  return new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...opts });
}
function mesh(geo, material, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const box = (w, h, d, material, x, y, z, parent) => mesh(new THREE.BoxGeometry(w, h, d), material, x, y, z, parent);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function signTex(text, bg, fg) {
  return canvasTex(512, 128, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 8; g.strokeRect(6, 6, w - 12, h - 12);
    g.fillStyle = fg; g.font = 'bold 64px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 4);
  });
}

/* ------------------------------------------------------------------ */
/* 場景 / 相機 / 燈光                                                  */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fd4ff, 120, 300);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.3, 800);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = PI * 0.47;
controls.minDistance = 6;
controls.maxDistance = 170;

const hemi = new THREE.HemisphereLight(0xdcefff, 0x6b8f4a, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 320 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const moonLight = new THREE.DirectionalLight(0x9fb6ff, 0);
scene.add(moonLight, moonLight.target);

const moon = new THREE.Mesh(new THREE.SphereGeometry(6, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff6d8, fog: false }));
scene.add(moon);
const sunDisc = new THREE.Mesh(new THREE.SphereGeometry(8, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff2b0, fog: false }));
scene.add(sunDisc);

// 夜空星星
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = rand() * PI * 2, ph = Math.acos(rr(0.05, 1));
    pos[i * 3] = Math.sin(ph) * Math.cos(th) * 380;
    pos[i * 3 + 1] = Math.cos(ph) * 380;
    pos[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * 380;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var skyStars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
  scene.add(skyStars);
}

/* ------------------------------------------------------------------ */
/* 共用材質（日夜會調整）                                               */
/* ------------------------------------------------------------------ */
const bulbMat = new THREE.MeshStandardMaterial({ color: 0xfff3c4, emissive: 0xffd27a, emissiveIntensity: 0 });
const headMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xfff6cc, emissiveIntensity: 0.2 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0x991111, emissive: 0xff2020, emissiveIntensity: 0.3 });
const shopGlassMat = new THREE.MeshStandardMaterial({ color: 0x8fb6c9, roughness: 0.15, metalness: 0.2, emissive: 0xffd9a0, emissiveIntensity: 0 });
const glassDark = new THREE.MeshStandardMaterial({ color: 0x2a3b4c, roughness: 0.2, metalness: 0.3 });
const doorMat = mat(0x6b4a2f);
const nightMats = []; // { mat, base, owner? }

/* ------------------------------------------------------------------ */
/* 地面、道路                                                          */
/* ------------------------------------------------------------------ */
const ROADS = [-30, 0, 30];
const RW = 8, EXT = 80, HALF = 50;
const colliders = [];
const pickables = [];

const ground = mesh(new THREE.PlaneGeometry(700, 700), mat(0x86c25e));
ground.rotation.x = -PI / 2; ground.castShadow = false;
scene.add(ground);

const asphalt = mat(0x3d4047);
for (const c of ROADS) {
  const a = mesh(new THREE.PlaneGeometry(EXT * 2, RW), asphalt, 0, 0.02, c, scene); a.rotation.x = -PI / 2; a.castShadow = false;
  const b = mesh(new THREE.PlaneGeometry(RW, EXT * 2), asphalt, c, 0.025, 0, scene); b.rotation.x = -PI / 2; b.castShadow = false;
}
// 標線與斑馬線（InstancedMesh）
{
  const marks = [];
  const nearX = (t) => ROADS.some(c => Math.abs(t - c) < 6.5);
  for (const c of ROADS) {
    for (let t = -EXT + 2; t < EXT; t += 4) {
      if (nearX(t)) continue;
      marks.push([t, c, 1.8, 0.18]);   // 沿 x 方向的道路中線
      marks.push([c, t, 0.18, 1.8]);   // 沿 z 方向
    }
  }
  for (const cx of ROADS) for (const cz of ROADS) {
    for (let k = -3.3; k <= 3.31; k += 1.1) {
      marks.push([cx + 5.3, cz + k, 1.8, 0.55], [cx - 5.3, cz + k, 1.8, 0.55]);
      marks.push([cx + k, cz + 5.3, 0.55, 1.8], [cx + k, cz - 5.3, 0.55, 1.8]);
    }
  }
  const geo = new THREE.PlaneGeometry(1, 1); geo.rotateX(-PI / 2);
  const im = new THREE.InstancedMesh(geo, mat(0xf2f2f2), marks.length);
  const m4 = new THREE.Matrix4();
  marks.forEach(([x, z, sx, sz], i) => { m4.makeScale(sx, 1, sz); m4.setPosition(x, 0.04, z); im.setMatrixAt(i, m4); });
  im.receiveShadow = true;
  scene.add(im);
}

/* ------------------------------------------------------------------ */
/* 樹木                                                                */
/* ------------------------------------------------------------------ */
const trunkGeo = new THREE.CylinderGeometry(0.18, 0.26, 1.6, 7); trunkGeo.translate(0, 0.8, 0);
const roundGeo = new THREE.IcosahedronGeometry(1.4, 1);
const pineGeo = new THREE.ConeGeometry(1.4, 2.4, 8);
const leafColors = [0x4f9d48, 0x5eaa4f, 0x3f8a3f, 0x6bb35a, 0x7fbf4d];
const trees = [];
function makeTree(x, z, s = 1, kind) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  mesh(trunkGeo, mat(0x7a5233), 0, 0, 0, g);
  const leaf = mat(pick(leafColors), { flatShading: true });
  if ((kind || (rand() < 0.4 ? 'pine' : 'round')) === 'pine') {
    mesh(pineGeo, leaf, 0, 2.4, 0, g);
    const top = mesh(pineGeo, leaf, 0, 3.6, 0, g); top.scale.setScalar(0.72);
  } else {
    const a = mesh(roundGeo, leaf, 0, 2.7, 0, g); a.rotation.set(rand(), rand(), rand());
    const b = mesh(roundGeo, leaf, 0.6, 2.2, 0.3, g); b.scale.setScalar(0.65);
  }
  g.rotation.y = rand() * PI * 2;
  g.userData = { kind: 'tree', name: '大樹', shake: 0 };
  scene.add(g);
  pickables.push(g); trees.push(g);
  colliders.push({ minX: x - 0.35 * s, maxX: x + 0.35 * s, minZ: z - 0.35 * s, maxZ: z + 0.35 * s });
  return g;
}

/* ------------------------------------------------------------------ */
/* 建築                                                                */
/* ------------------------------------------------------------------ */
function facadeTextures(cols, rows, wall, win, style) {
  const cw = 32, ch = 40;
  const lit = [];
  for (let i = 0; i < cols * rows; i++) lit.push(rand() < (style === 'glass' ? 0.7 : 0.55));
  const warm = style === 'glass' ? ['#d8ecff', '#eef6ff', '#c4e0ff'] : ['#ffd27a', '#ffe7a3', '#ffc35c'];
  const map = canvasTex(cols * cw, rows * ch, (g, w, h) => {
    g.fillStyle = wall; g.fillRect(0, 0, w, h);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const [x, y, ww, hh] = style === 'glass' ? [c * cw + 2, r * ch + 3, cw - 4, ch - 6] : [c * cw + 8, r * ch + 9, cw - 16, ch - 17];
      const grd = g.createLinearGradient(x, y, x + ww, y + hh);
      grd.addColorStop(0, win); grd.addColorStop(1, '#1f3142');
      g.fillStyle = grd; g.fillRect(x, y, ww, hh);
      g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x, y, ww * 0.35, hh);
      if (style !== 'glass') { g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x - 2, y + hh, ww + 4, 3); }
    }
  });
  const emissiveMap = canvasTex(cols * cw, rows * ch, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (!lit[r * cols + c]) continue;
      const [x, y, ww, hh] = style === 'glass' ? [c * cw + 2, r * ch + 3, cw - 4, ch - 6] : [c * cw + 8, r * ch + 9, cw - 16, ch - 17];
      g.fillStyle = pick(warm); g.fillRect(x, y, ww, hh);
    }
  });
  return { map, emissiveMap };
}

const buildings = [];
function makeFacadeBox(w, h, d, floors, wall, roof, style, group, win) {
  const cols = Math.max(2, Math.round(w / 2.4));
  const { map, emissiveMap } = facadeTextures(cols, floors, wall, win || (style === 'glass' ? '#6f9cc0' : '#4c6a85'), style);
  const side = new THREE.MeshStandardMaterial({ map, emissiveMap, emissive: 0xffffff, emissiveIntensity: 0, roughness: style === 'glass' ? 0.35 : 0.85, metalness: style === 'glass' ? 0.25 : 0 });
  const top = mat(roof);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, top, top, side, side]);
  m.position.y = h / 2; m.castShadow = m.receiveShadow = true;
  group.add(m);
  return side;
}

const TYPE_DESC = {

  apartment: ['住戶彼此熟識的老公寓，樓下信箱塞滿了傳單。', '頂樓有個小菜園，是住戶們的秘密基地。', '每到晚上，家家戶戶的燈光像星星一樣。'],
  office: ['玻璃帷幕的辦公大樓，白天人來人往，晚上依然燈火通明。', '頂樓視野極佳，可以俯瞰整個小鎮。', '小鎮新創公司的聚集地，咖啡消耗量驚人。'],
};
const SURNAMES = ['陳', '林', '黃', '張', '李', '王', '吳', '劉', '蔡', '楊', '許', '鄭'];
const APT = ['楓葉', '海風', '雲朵', '月光', '櫻花', '翠竹', '晴空', '橡木'];
const OFFICE = ['未來', '星河', '天際', '創新', '藍海', '光點'];
const SHOPS = [
  { name: '小鎮花店', desc: '今天的玫瑰特別新鮮，老闆說買一束送一朵。', color: '#f7c6d9', awn: ['#ff8fb1', '#ffffff'] },
  { name: '轉角書店', desc: '有一面牆全是二手漫畫，常有小朋友坐在地上看。', color: '#e7d3b0', awn: ['#4f7cac', '#ffffff'] },
  { name: '玩具店', desc: '櫥窗裡的小火車每天都在繞圈圈。', color: '#ffe08a', awn: ['#ff5a5f', '#ffffff'] },
  { name: '雜貨店', desc: '從醬油到電池，這裡什麼都買得到。', color: '#d9e8c4', awn: ['#4caf50', '#ffffff'] },
  { name: '披薩店', desc: '窯烤披薩的香味會飄到隔壁街。', color: '#f2d0a4', awn: ['#d84a3a', '#fff3d6'] },
];
const SPECIALS = [
  { type: 'shop', name: '晨光咖啡', label: '咖啡店', desc: '小鎮居民最愛的早餐店，拿鐵拉花是一隻小貓。', stat: '營業時間 07:00 - 19:00', color: '#c9a27e', awn: ['#5b3a29', '#f3e1c7'] },
  { type: 'shop', name: '老街麵包店', label: '麵包店', desc: '每天清晨五點開始烤麵包，菠蘿麵包一出爐就秒殺。', stat: '今日出爐：菠蘿、紅豆、肉鬆', color: '#f6d8a8', awn: ['#e07a3a', '#fff6e5'] },
  { type: 'shop', name: '彩虹冰淇淋', label: '冰淇淋店', desc: '有 31 種口味，最受歡迎的是芒果牛奶。', stat: '今日推薦：芋頭牛奶', color: '#cdeefa', awn: ['#ff8fb1', '#8fd3ff'] },
  { type: 'tower', name: '綠洲醫院', label: '醫院', floors: 5, wall: '#f4f6f8', roof: '#c9d2da', sign: ['＋ 綠洲醫院', '#e23d3d', '#ffffff'], cross: true, desc: '24 小時守護小鎮居民的健康。', stat: '醫護人員 86 人・病床 120 床' },

function addSign(group, text, bg, fg, w, y, z) {
  const tex = signTex(text, bg, fg);
  const m = new THREE.MeshStandardMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0 });
  nightMats.push({ mat: m, base: 0.6 });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 4), m);
  p.position.set(0, y, z);
  group.add(p);
}

function registerBuilding(group, lot, hx, hz, h, info, mats) {
  group.userData = { kind: 'building', info, lightsOn: true, mats, h, hx, hz };
  colliders.push({ minX: lot.x - hx, maxX: lot.x + hx, minZ: lot.z - hz, maxZ: lot.z + hz });
  info.door = new THREE.Vector3(lot.x + lot.fx * (Math.max(hx, hz) + 1.6), 0, lot.z + lot.fz * (Math.max(hx, hz) + 1.6));
  scene.add(group); pickables.push(group); buildings.push(group);
}

  box(1.8, 2.5, 0.12, glassDark, 0, 1.25, fz + 0.06, g);
  box(2.6, 0.2, 1.4, mat(0x9aa1a8), 0, 2.7, fz + 0.65, g);
  // 屋頂
  box(s + 0.3, 0.4, s * 0.9 + 0.3, mat(spec.roof), 0, h + 0.2, 0, g);
  if (glass) {

    mesh(new THREE.CylinderGeometry(0.9, 0.9, 1.6, 12), mat(0x9c8f80), s * 0.22, h + 1.4, -s * 0.15, g);

    for (let i = 0; i < 12; i++) { const a = i / 12 * PI * 2; c.save(); c.translate(128, 128); c.rotate(a); c.fillRect(-4, -112, 8, i % 3 === 0 ? 22 : 12); c.restore(); }
  });

  nightMats.push({ mat: faceMat, base: 0.9 });

  }, [side]);
}

  const nx = Math.max(1, Math.floor(bw / 10.5)), nz = Math.max(1, Math.floor(bd / 10.5));
  for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
    const lw = bw / nx, ld = bd / nz;
    const x = x0 + (i + 0.5) * lw, z = z0 + (j + 0.5) * ld;
    let bestX = ROADS.reduce((b, c) => Math.abs(c - x) < Math.abs(b - x) ? c : b);
    let bestZ = ROADS.reduce((b, c) => Math.abs(c - z) < Math.abs(b - z) ? c : b);
    const dx = Math.abs(bestX - x), dz = Math.abs(bestZ - z);
    const fx = dx < dz ? Math.sign(bestX - x) : 0, fz = dx < dz ? 0 : Math.sign(bestZ - z);
    lots.push({ x, z, w: lw, d: ld, s: Math.min(Math.min(lw, ld) - 3.2, 9), fx, fz, r: Math.hypot(x, z) });
  }
}

function placeLot(lot, build) {
  const before = buildings.length;
  build(lot);
  const g = buildings[before];
  g.position.set(lot.x, 0, lot.z);
  g.rotation.y = Math.atan2(lot.fx, lot.fz);
  // 旋轉 90 度時交換碰撞盒
  if (lot.fx !== 0) {
    const c = colliders.find(c => Math.abs((c.minX + c.maxX) / 2 - lot.x) < 0.01 && Math.abs((c.minZ + c.maxZ) / 2 - lot.z) < 0.01 && c.maxX - c.minX > 2);
    if (c) { const hx = (c.maxX - c.minX) / 2, hz = (c.maxZ - c.minZ) / 2; c.minX = lot.x - hz; c.maxX = lot.x + hz; c.minZ = lot.z - hx; c.maxZ = lot.z + hx; }
  }
}

function buildPark(cx, cz, bw, bd) {
  const pathM = mat(0xe3d6b8);
  const p1 = box(bw - 3, 0.05, 2.2, pathM, cx, 0.29, cz, scene); p1.castShadow = false;
  const p2 = box(2.2, 0.05, bd - 3, pathM, cx, 0.29, cz, scene); p2.castShadow = false;
  const ring = mesh(new THREE.CylinderGeometry(5, 5, 0.05, 40), pathM, cx, 0.3, cz, scene); ring.castShadow = false;
  // 噴泉
  const f = new THREE.Group(); f.position.set(cx, 0, cz);
  const stone = mat(0xbdb6a8);
  mesh(new THREE.CylinderGeometry(3.2, 3.4, 0.8, 32), stone, 0, 0.4, 0, f);
  const w = mesh(new THREE.CylinderGeometry(2.9, 2.9, 0.1, 32), new THREE.MeshStandardMaterial({ color: 0x59b7e6, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.85 }), 0, 0.75, 0, f);
  w.castShadow = false;
  mesh(new THREE.CylinderGeometry(0.35, 0.5, 2.2, 12), stone, 0, 1.5, 0, f);
  mesh(new THREE.CylinderGeometry(1.2, 0.4, 0.4, 20), stone, 0, 2.6, 0, f);
  f.userData = { kind: 'fountain', name: '許願噴泉' };
  scene.add(f); pickables.push(f); fountain = f;
  colliders.push({ minX: cx - 3.4, maxX: cx + 3.4, minZ: cz - 3.4, maxZ: cz + 3.4 });
  // 水花粒子
  const pos = new Float32Array(water.n * 3);
  water.vel = new Float32Array(water.n * 3);
  water.life = new Float32Array(water.n);
  for (let i = 0; i < water.n; i++) water.life[i] = -rand() * 2;
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  water.points = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfe8ff, size: 0.22, transparent: true, opacity: 0.9, depthWrite: false }));
  water.points.position.set(cx, 0, cz);
  scene.add(water.points);
  // 樹、長椅、花圃
  for (let k = 0; k < 8; k++) {
    const a = k / 8 * PI * 2 + PI / 8;
    makeTree(cx + Math.cos(a) * 7.8, cz + Math.sin(a) * 7.8, rr(0.85, 1.15));
  }
  const benchM = mat(0x9c6b3e), legM = mat(0x444444);
  for (const [bx, bz, ry] of [[3.6, 4, 0], [-3.6, -4, PI], [4, -3.6, PI / 2], [-4, 3.6, -PI / 2]]) {
    const b = new THREE.Group(); b.position.set(cx + bx, 0.3, cz + bz); b.rotation.y = ry;
    box(1.8, 0.1, 0.5, benchM, 0, 0.45, 0, b);

    box(0.08, 0.45, 0.45, legM, -0.8, 0.22, 0, b); box(0.08, 0.45, 0.45, legM, 0.8, 0.22, 0, b);
    scene.add(b);
  }
  const flowerColors = [0xff6b8a, 0xffd23f, 0xb084f5, 0xff9a3c, 0xffffff];
  const fgeo = new THREE.IcosahedronGeometry(0.22, 0);
  for (let k = 0; k < 4; k++) {
    const qx = (k % 2 ? 1 : -1) * 6.5, qz = (k < 2 ? 1 : -1) * 6.5;
    for (let i = 0; i < 14; i++) {
      const fl = mesh(fgeo, mat(pick(flowerColors)), cx + qx + rr(-1.4, 1.4), 0.42, cz + qz + rr(-1.4, 1.4), scene);
      fl.castShadow = false;
    }
  }
}

const carXZ = (car) => car.axis === 'x' ? [car.along, car.lane] : [car.lane, car.along];
function updateCars(dt) {
  const span = EXT * 2;
  for (const car of cars) {
    let target = car.base;
    // 紅綠燈
    if (Math.abs(car.along) < HALF) {
      const sig = signal(car.axis);
      if (sig !== 'g') {
        for (const r of ROADS) {
          const stop = r - car.dir * (6.6 + car.len / 2);
          const d = (stop - car.along) * car.dir;
          if (d > (sig === 'y' ? 1.5 : -0.3) && d < 14) target = Math.min(target, Math.max(0, d) * 0.9);
        }
      }
    }
    // 前車
    for (const o of cars) {
      if (o === car || o.axis !== car.axis || o.lane !== car.lane) continue;
      let gap = (o.along - car.along) * car.dir;
      if (gap < 0) gap += span;
      const need = (o.len + car.len) / 2 + 2.2;
      if (gap < need + 10) target = Math.min(target, Math.max(0, gap - need) * 0.9);
    }
    // 讓行人（玩家）
    const [cx, cz] = carXZ(car);
    const rx = player.position.x - cx, rz = player.position.z - cz;
    const fwd = car.axis === 'x' ? rx * car.dir : rz * car.dir;
    const lat = car.axis === 'x' ? rz : rx;
    if (fwd > 0 && fwd < car.len / 2 + 7 && Math.abs(lat) < 1.9) {
      target = Math.min(target, Math.max(0, fwd - car.len / 2 - 1.5) * 0.8);
      if (car.v < 0.5 && car.honk <= 0) { car.honk = 4; honk(0.06); }
    }
    car.honk -= dt;
    car.v += (target - car.v) * Math.min(1, dt * (target < car.v ? 5 : 1.5));
    car.along += car.v * car.dir * dt;
    if (car.along > EXT) car.along -= span;
    if (car.along < -EXT) car.along += span;
    const [x, z] = carXZ(car);
    car.obj.position.x = x; car.obj.position.z = z;
    // 輪子轉動
    car.obj.children.forEach(m => { if (m.geometry === CG.wheel) m.rotation.z -= car.v * dt / 0.38; });
  }
}

    }

    pos[k] += v[k] * dt; pos[k + 1] += v[k + 1] * dt; pos[k + 2] += v[k + 2] * dt;
  }
  water.points.geometry.attributes.position.needsUpdate = true;
}

/* ------------------------------------------------------------------ */
/* 音效                                                                */
/* ------------------------------------------------------------------ */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, { type = 'sine', vol = 0.15, delay = 0, to } = {}) {
  const a = actx; if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const honk = (vol = 0.08) => { tone(392, 0.22, { type: 'square', vol }); tone(494, 0.22, { type: 'square', vol: vol * 0.8 }); tone(392, 0.3, { type: 'square', vol, delay: 0.3 }); tone(494, 0.3, { type: 'square', vol: vol * 0.8, delay: 0.3 }); };
const chime = () => [660, 880, 1320].forEach((f, i) => tone(f, 0.35, { type: 'triangle', vol: 0.12, delay: i * 0.08 }));
const bell = (n) => { for (let i = 0; i < n; i++) { tone(523, 2.2, { vol: 0.2, delay: i * 1.1 }); tone(1046, 1.6, { vol: 0.06, delay: i * 1.1 }); tone(1570, 1.0, { vol: 0.03, delay: i * 1.1 }); } };
const pop = () => tone(180, 0.4, { type: 'triangle', vol: 0.2, to: 40 });
const whoosh = () => tone(300, 0.9, { type: 'sawtooth', vol: 0.025, to: 1400 });
const blip = () => tone(520, 0.12, { type: 'sine', vol: 0.12, to: 880 });
const rustle = () => { for (let i = 0; i < 6; i++) tone(rr(1800, 3200), 0.08, { type: 'triangle', vol: 0.03, delay: i * 0.05 }); };
const splash = () => { for (let i = 0; i < 8; i++) tone(rr(900, 2400), 0.12, { type: 'sine', vol: 0.05, delay: i * 0.04, to: rr(300, 600) }); };

/* UI                                                                  */
/* ------------------------------------------------------------------ */
const $ = (id) => document.getElementById(id);
const ui = { stars: $('stars'), clock: $('clockText'), slider: $('timeSlider'), info: $('info'), tip: $('tip'), toast: $('toast') };
let timeOfDay = 10, autoTime = true, follow = true, selected = null;
let toastTimer;
function toast(msg) {
  ui.toast.textContent = msg; ui.toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => ui.toast.classList.remove('show'), 2600);
}
$('helpBtn').onclick = () => $('title').classList.toggle('open');
ui.slider.oninput = () => { timeOfDay = parseFloat(ui.slider.value); };
$('autoBtn').onclick = (e) => { autoTime = !autoTime; e.target.textContent = autoTime ? '⏸ 暫停時間' : '▶️ 時間流動'; };
$('nightBtn').onclick = () => { timeOfDay = isNight() ? 10 : 20.5; ui.slider.value = timeOfDay; };
$('camBtn').onclick = (e) => { follow = !follow; e.target.textContent = follow ? '🎥 自由視角' : '🎯 跟隨小人'; toast(follow ? '鏡頭跟隨小人' : '自由視角：隨意拖曳觀看'); };
$('fwBtn').onclick = () => { audio(); for (let k = 0; k < 6; k++) setTimeout(() => launchFirework(), k * 280); if (!isNight()) toast('🎆 晚上看煙火更漂亮喔！'); };
$('closeBtn').onclick = () => select(null);

};
$('goBtn').onclick = () => { if (selected) { playerState.target = selected.userData.info.door.clone(); showMarker(playerState.target); } };
const isNight = () => timeOfDay < 6 || timeOfDay > 18;

const selRing = new THREE.Mesh(new THREE.RingGeometry(1, 1.12, 64), new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true, opacity: 0.9, depthWrite: false }));
selRing.rotation.x = -PI / 2; selRing.visible = false; scene.add(selRing);
const marker = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.6, 32), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false }));
marker.rotation.x = -PI / 2; scene.add(marker);
let markerT = 0;
function showMarker(p) { marker.position.set(p.x, 0.34, p.z); markerT = 1; }

function select(b) {

/* ------------------------------------------------------------------ */
/* 互動（點擊 / 懸停）                                                  */
/* ------------------------------------------------------------------ */
const anims = [];
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.3);
function rootOf(o) { while (o) { if (o.userData && o.userData.kind) return o; o = o.parent; } return null; }
function pickAt(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, true);
  return hits.length ? rootOf(hits[0].object) : null;
}
const KIND_TIP = { tree: '🌳 搖一搖', car: '🚗 按喇叭', walker: '🧍 打招呼', fountain: '⛲ 許願噴泉', windmill: '🌬️ 吹風車' };

function bounce(obj, amount = 0.12) {
  let t = 0;
  anims.push(dt => {
    t += dt;
    const k = Math.exp(-t * 4) * Math.sin(t * 18) * amount;
    obj.scale.set(1 - k * 0.5, 1 + k, 1 - k * 0.5);
    if (t > 1.4) { obj.scale.set(1, 1, 1); return false; }
    return true;
  });
}
function hop(obj, height = 1.2, dur = 0.5) {
  let t = 0; const y0 = obj.position.y;
  anims.push(dt => {
    t += dt;
    obj.position.y = y0 + Math.sin(Math.min(t / dur, 1) * PI) * height;
    return t < dur || ((obj.position.y = y0), false);
  });
}

function handleClick(cx, cy) {
  const hit = pickAt(cx, cy);
  if (hit) {
    const u = hit.userData;
    switch (u.kind) {
      case 'building':
        select(hit); bounce(hit, 0.06 + 0.4 / u.h); blip();
        if (u.info.clock) {
          const n = ((Math.floor(timeOfDay) + 11) % 12) + 1;
          bell(Math.min(n, 3));
          toast(`🕰️ 噹～ 現在時間 ${fmtTime(timeOfDay)}`);
        }
        return;
      case 'tree': {
        rustle();
        let t = 0; const r0 = hit.rotation.z;
        anims.push(dt => { t += dt; hit.rotation.z = r0 + Math.sin(t * 22) * 0.12 * Math.exp(-t * 3); hit.rotation.x = Math.cos(t * 17) * 0.06 * Math.exp(-t * 3); return t < 1.6 || ((hit.rotation.z = r0), (hit.rotation.x = 0), false); });
        const p = hit.position.clone(); p.y = 2.8 * hit.scale.x;
        burst(p, [0x6bb35a, 0x9ad66e, 0x4f9d48, 0xffd23f], 30, 3, 1.4, 0.35);
        return;
      }
      case 'car': {
        honk(); hop(hit, 0.6, 0.35);
        toast(`${u.name === '公車' ? '🚌' : '🚗'} 叭叭！`);
        return;
      }
      case 'walker': {
        const w = u.w;
        w.pause = 2.5;
        hit.lookAt(player.position.x, 0, player.position.z);
        hop(hit, 0.5, 0.35);
        hit.userData.waving = true;
        let t = 0; const aR = hit.userData.limbs.aR;
        anims.push(dt => { t += dt; aR.rotation.z = 2.6; aR.rotation.x = 0; aR.rotation.y = Math.sin(t * 14) * 0.5; if (t > 2.2) { hit.userData.waving = false; aR.rotation.set(0, 0, 0); return false; } return true; });
        bubble(pick(GREETS), hit);
        tone(600, 0.15, { to: 900, vol: 0.1 });
        return;
      }
      case 'fountain':
        fountainBoost = 3; splash(); bounce(hit, 0.05);
        toast(pick(['⛲ 許了一個願望 ✨', '⛲ 噗～水花噴好高！', '⛲ 硬幣丟進去了，願望會實現的！']));
        return;
      case 'windmill':
        windBoost = 6; tone(200, 1.2, { type: 'sawtooth', vol: 0.03, to: 90 });
        toast('🌬️ 呼～風車轉得好快！');
        return;
    }
  }
  // 點到地面：走過去
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const p = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(groundPlane, p) && Math.abs(p.x) < 140 && Math.abs(p.z) < 140) {
    playerState.target = p; showMarker(p);
  }
}

let down = null;
renderer.domElement.addEventListener('pointerdown', e => { audio(); down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (moved < 7 && performance.now() - down.t < 600) handleClick(e.clientX, e.clientY);
  down = null;
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || e.buttons) { ui.tip.style.display = 'none'; return; }
  const hit = pickAt(e.clientX, e.clientY);
  if (hit) {
    ui.tip.textContent = hit.userData.kind === 'building' ? `🏠 ${hit.userData.info.name}` : KIND_TIP[hit.userData.kind];
    ui.tip.style.display = 'block';
    ui.tip.style.left = e.clientX + 14 + 'px'; ui.tip.style.top = e.clientY + 12 + 'px';
    renderer.domElement.style.cursor = 'pointer';
  } else { ui.tip.style.display = 'none'; renderer.domElement.style.cursor = 'grab'; }
});
renderer.domElement.addEventListener('pointerleave', () => { ui.tip.style.display = 'none'; });

const keys = new Set();
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) { keys.add(k); e.preventDefault(); }
  if (k === ' ' && !playerState.jump) { playerState.jump = 0.001; }
  if (k === 'f') $('fwBtn').click();
  if (k === 'n') $('nightBtn').click();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

/* ------------------------------------------------------------------ */
/* 玩家移動                                                            */
/* ------------------------------------------------------------------ */
function blocked(x, z, r = 0.38) {
  if (Math.abs(x) > 140 || Math.abs(z) > 140) return true;
  for (const c of colliders) if (x > c.minX - r && x < c.maxX + r && z > c.minZ - r && z < c.maxZ + r) return true;
  return false;
}
const tmpF = new THREE.Vector3(), tmpR = new THREE.Vector3();
function updatePlayer(dt) {
  let mx = 0, mz = 0;
  const kf = (keys.has('w') || keys.has('arrowup')) - (keys.has('s') || keys.has('arrowdown'));
  const kr = (keys.has('d') || keys.has('arrowright')) - (keys.has('a') || keys.has('arrowleft'));
  if (kf || kr) {
    camera.getWorldDirection(tmpF); tmpF.y = 0; tmpF.normalize();
    tmpR.crossVectors(tmpF, camera.up).normalize();
    mx = tmpF.x * kf + tmpR.x * kr; mz = tmpF.z * kf + tmpR.z * kr;
    playerState.target = null;
  } else if (playerState.target) {
    mx = playerState.target.x - player.position.x; mz = playerState.target.z - player.position.z;
    if (Math.hypot(mx, mz) < 0.3) { playerState.target = null; mx = mz = 0; }
  }
  const len = Math.hypot(mx, mz);
  const wantSpeed = len > 0 ? 6.5 : 0;
  playerState.speed += (wantSpeed - playerState.speed) * Math.min(1, dt * 10);
  if (len > 0) {
    mx /= len; mz /= len;
    const step = playerState.speed * dt;
    const nx = player.position.x + mx * step, nz = player.position.z + mz * step;
    let moved = false;
    if (!blocked(nx, nz)) { player.position.x = nx; player.position.z = nz; moved = true; }
    else if (!blocked(nx, player.position.z)) { player.position.x = nx; moved = true; }
    else if (!blocked(player.position.x, nz)) { player.position.z = nz; moved = true; }
    if (!moved && playerState.target) playerState.target = null;
    const targetRot = Math.atan2(mx, mz);
    let d = targetRot - player.rotation.y;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    player.rotation.y += d * Math.min(1, dt * 12);
  }
  // 跳躍
  if (playerState.jump) {
    playerState.jump += dt;
    const t = playerState.jump / 0.55;
    player.position.y = Math.sin(Math.min(t, 1) * PI) * 1.3;
    if (t >= 1) { playerState.jump = 0; player.position.y = 0; }
  } else {
    // 站在人行道 / 草地上略微抬高
    const onBlock = blockRanges.some(([a, b]) => player.position.x > a && player.position.x < b) && blockRanges.some(([a, b]) => player.position.z > a && player.position.z < b);
    player.position.y += ((onBlock ? 0.24 : 0) - player.position.y) * Math.min(1, dt * 15);
  }
  animatePerson(player, dt, playerState.speed);
  playerRing.position.x = player.position.x; playerRing.position.z = player.position.z;
  playerRing.position.y = 0.06 + (player.position.y > 0.1 && !playerState.jump ? 0.24 : 0) + 0.27 * (playerState.jump ? 0 : 0);
  playerRing.material.opacity = 0.5 + Math.sin(elapsed * 4) * 0.25;
}

function updateWalkers(dt) {
  for (const w of walkers) {
    if (w.pause > 0) { w.pause -= dt; animatePerson(w.obj, dt, 0); continue; }
    // 前方有玩家就停一下
    const [x, z] = w.axis === 'x' ? [w.along, w.line] : [w.line, w.along];
    const ahead = (w.axis === 'x' ? player.position.x - x : player.position.z - z) * w.dir;
    const lat = w.axis === 'x' ? player.position.z - z : player.position.x - x;
    const sp = ahead > 0 && ahead < 1.6 && Math.abs(lat) < 0.8 ? 0 : w.speed;
    w.along += sp * w.dir * dt;
    if (w.along > 48.5 || w.along < -48.5) { w.dir *= -1; w.along = clamp(w.along, -48.5, 48.5); }
    const [nx, nz] = w.axis === 'x' ? [w.along, w.line] : [w.line, w.along];
    const onRoad = ROADS.some(c => Math.abs((w.axis === 'x' ? nx : nz) - c) < 4);
    w.obj.position.set(nx, onRoad ? 0.03 : 0.2, nz);
    w.obj.rotation.y = w.axis === 'x' ? (w.dir > 0 ? PI / 2 : -PI / 2) : (w.dir > 0 ? 0 : PI);
    animatePerson(w.obj, dt, sp);
  }
}

/* ------------------------------------------------------------------ */
/* 日夜                                                                */
/* ------------------------------------------------------------------ */
const C = {
  day: new THREE.Color(0x8fd0ff), dusk: new THREE.Color(0xff9e6b), night: new THREE.Color(0x0c1430),
  sunW: new THREE.Color(0xffffff), sunO: new THREE.Color(0xffa25e),
  hemiDay: new THREE.Color(0xdcefff), hemiNight: new THREE.Color(0x3a4a7a),
};
const sky = new THREE.Color(), tmpC = new THREE.Color();
let nightK = 0;
function fmtTime(t) { const h = Math.floor(t) % 24, m = Math.floor((t % 1) * 60); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }
function updateSky() {
  const ang = (timeOfDay - 6) / 24 * PI * 2;
  const el = Math.sin(ang);
  const dayK = smooth(-0.06, 0.28, el);
  nightK = 1 - smooth(-0.18, 0.06, el);
  const duskK = Math.max(0, 1 - Math.abs(el) / 0.3) * (1 - nightK * 0.6);
  sky.copy(C.night).lerp(C.day, dayK).lerp(C.dusk, duskK * 0.55);
  scene.background = sky; scene.fog.color.copy(sky);
  document.body.style.background = '#' + sky.getHexString();
  const sx = Math.cos(ang) * 160, sy = el * 160;
  sun.position.set(sx, Math.max(sy, 8), 60);
  sun.intensity = 2.7 * dayK;
  sun.color.copy(C.sunW).lerp(C.sunO, duskK);
  sunDisc.position.set(sx * 1.6, sy * 1.6, 96); sunDisc.visible = el > -0.1;
  sunDisc.material.color.copy(tmpC.set(0xfff2b0).lerp(C.sunO, duskK));
  moon.position.set(-sx * 1.6, -sy * 1.6, -96); moon.visible = el < 0.1;
  moonLight.position.set(-sx, Math.max(-sy, 20), -60);
  moonLight.intensity = 0.55 * nightK;
  hemi.intensity = 0.35 + 0.85 * dayK;
  hemi.color.copy(C.hemiNight).lerp(C.hemiDay, dayK);
  skyStars.material.opacity = nightK;
  bulbMat.emissiveIntensity = nightK * 2.5;
  headMat.emissiveIntensity = 0.2 + nightK * 2.5;
  tailMat.emissiveIntensity = 0.3 + nightK * 1.5;
  shopGlassMat.emissiveIntensity = nightK * 0.9;
  for (const L of nightLights) L.intensity = nightK * 45;
  for (const b of buildings) for (const m of b.userData.mats) {
    const target = b.userData.lightsOn ? nightK * 1.3 : 0;
    m.emissiveIntensity += (target - m.emissiveIntensity) * 0.15;
  }
  for (const n of nightMats) n.mat.emissiveIntensity = nightK * n.base;
  ui.clock.textContent = (nightK > 0.5 ? '🌙 ' : '☀️ ') + fmtTime(timeOfDay);
  $('nightBtn').textContent = isNight() ? '☀️ 切到白天' : '🌙 切到晚上';
}
function updateSignals(dt) {
  signalT += dt;
  for (const ax of ['x', 'z']) {
    const s = signal(ax);
    for (const k of ['r', 'y', 'g']) lampMats[ax][k].emissiveIntensity = s === k ? 2.2 : 0;
  }
}

/* ------------------------------------------------------------------ */
/* 主迴圈                                                              */
/* ------------------------------------------------------------------ */
camera.position.set(player.position.x + 32, 34, player.position.z + 42);
controls.target.set(player.position.x, 1.5, player.position.z);
const clk = new THREE.Clock();
let elapsed = 0;
const camDelta = new THREE.Vector3(), desired = new THREE.Vector3();
let introT = 0;
function loop() {
  const dt = Math.min(clk.getDelta(), 0.05);
  elapsed += dt;
  if (autoTime) { timeOfDay = (timeOfDay + dt * 0.1) % 24; ui.slider.value = timeOfDay; }
  updateSky();
  updateSignals(dt);
  updatePlayer(dt);
  updateCars(dt);
  updateWalkers(dt);
  updateFountain(dt);
  updateStars(dt);
  updateFireworks(dt);
  for (let i = anims.length - 1; i >= 0; i--) if (!anims[i](dt)) anims.splice(i, 1);
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 180) c.position.x = -180; }
  windBoost = Math.max(0, windBoost - dt);
  windmill.userData.hub.rotation.z -= dt * (0.6 + (windBoost > 0 ? 5 * Math.min(1, windBoost) : 0));
  for (const f of flags) {
    const pos = f.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) { const x = pos.getX(i); pos.setZ(i, Math.sin(x * 3 - elapsed * 5) * 0.12 * x); }
    pos.needsUpdate = true;
  }
  const hr = (timeOfDay % 12) / 12 * PI * 2, mn = (timeOfDay % 1) * PI * 2;
  for (const c of clockHands) { c.hh.rotation.z = -hr; c.mm.rotation.z = -mn; }
  if (selected) { selRing.material.opacity = 0.6 + Math.sin(elapsed * 5) * 0.3; }
  if (markerT > 0) { markerT -= dt * 1.2; marker.material.opacity = Math.max(0, markerT); marker.scale.setScalar(1 + (1 - markerT) * 0.8); }
  if (follow) {
    desired.set(player.position.x, 1.5 + player.position.y * 0.3, player.position.z);
    camDelta.subVectors(desired, controls.target).multiplyScalar(Math.min(1, dt * 5));
    controls.target.add(camDelta); camera.position.add(camDelta);
  }
  // 開場鏡頭拉近
  if (introT < 1) {
    introT = Math.min(1, introT + dt * 0.5);
    const off = camera.position.clone().sub(controls.target);
    const want = off.clone().setLength(THREE.MathUtils.lerp(off.length(), 38, 0.04));
    camera.position.copy(controls.target).add(want);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.domElement.style.cursor = 'grab';
loop();
setTimeout(() => { const l = $('loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 700); }, 300);
toast('👋 歡迎來到晴空小鎮！點擊任何東西看看');
</script>
