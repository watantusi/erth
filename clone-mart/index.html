<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>分身便利店</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1d33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D store canvas; HUD chips pinned to the top corners; modal "store paper" sheets centered over the scene. Single night-sign look by design. */
:root{
  --night:#0f1d33;      /* page + HUD chip ground */
  --ink:#14233d;        /* text on paper, outlines */
  --paper:#fffaf0;      /* sheets, receipt */
  --sign:#ffcf3a;       /* store-sign yellow, primary action */
  --mint:#34d6a6;       /* good */
  --coral:#ff6058;      /* bad / alerts */
  --sky:#4da3ff;        /* register / info */
  --muted:#6b7890;
  --chip:rgba(15,29,51,.84);
  --f-display:'Bungee','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--f-body);
  touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#tags,#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.hud-l,.hud-r{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.chip{background:var(--chip);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.money b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--sign);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.day{flex-direction:column;align-items:stretch;gap:3px;padding:5px 12px;min-width:112px}
.day .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}
#clock{font-family:var(--f-display);font-weight:400;font-variant-numeric:tabular-nums}
.dayline{height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.dayline i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9fd3ff,#ffcf3a 60%,#f08a5d 80%,#6a7fd8)}
.stars{position:relative;font-size:17px;letter-spacing:1px;line-height:1}
.stars .s-bg{color:rgba(255,255,255,.2)}
.stars .s-fg{position:absolute;left:0;top:0;color:var(--sign);overflow:hidden;white-space:nowrap;width:60%}
#ratenum{font-family:var(--f-display);font-size:14px;font-variant-numeric:tabular-nums}
.hbtn{pointer-events:auto;border:2px solid var(--ink);background:var(--sign);color:var(--ink);font-weight:900;font-size:15px;border-radius:14px;
  padding:6px 12px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:6px}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.hbtn.ghost{background:var(--chip);color:var(--paper);border-color:rgba(255,255,255,.25);box-shadow:none;min-width:40px;justify-content:center}
.hbtn .cnt{font-family:var(--f-display);font-weight:400;font-size:12px;background:var(--ink);color:var(--sign);border-radius:8px;padding:2px 6px}
.hbtn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--ink),0 0 0 0 rgba(255,207,58,.7)}50%{box-shadow:0 3px 0 var(--ink),0 0 0 8px rgba(255,207,58,0)}}

#alerts{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
#alerts .al{background:rgba(255,96,88,.92);color:#fff;font-weight:900;font-size:13px;border-radius:10px;padding:4px 10px;border:2px solid rgba(0,0,0,.2)}
#alerts .al.info{background:rgba(77,163,255,.92)}
#alerts .al.warn{background:rgba(255,159,67,.95)}

#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;font-weight:700;font-size:15px;line-height:1.45;text-align:center;
  pointer-events:none;transition:opacity .3s,transform .3s}
#hint.off{opacity:0;transform:translate(-50%,12px)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
#toast div{background:var(--ink);color:var(--paper);border:2px solid var(--sign);font-weight:900;padding:7px 14px;border-radius:12px;font-size:15px;animation:toast 2.6s forwards;text-align:center}
#toast div.bad{border-color:var(--coral)}
#toast div.good{border-color:var(--mint)}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* ---------- world tags ---------- */
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform;white-space:nowrap}
.tag .ic{font-size:18px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.tag .ic:empty{display:none}
.tag .tx{font-size:11px;font-weight:900;color:#fff;background:rgba(15,29,51,.85);border-radius:7px;padding:1px 6px}
.tag .tx:empty{display:none}
.tag .bar{width:38px;height:6px;border-radius:3px;background:rgba(15,29,51,.75);border:1px solid rgba(255,255,255,.5);overflow:hidden}
.tag .bar i{display:block;height:100%;width:50%;background:var(--mint)}
.tag.shelf .tx{background:rgba(255,159,67,.95);color:var(--ink)}
.tag.shelf.empty .tx{background:var(--coral);color:#fff;animation:blink 1s steps(2) infinite}
.tag.reg .tx{background:var(--sky)}
@keyframes blink{50%{opacity:.55}}
.float{position:absolute;left:0;top:0;font-family:var(--f-display);font-size:18px;color:var(--sign);white-space:nowrap;
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);animation:floatUp 1.2s ease-out forwards}
.float.bad{color:var(--coral)} .float.good{color:var(--mint)} .float.txt{font-family:var(--f-body);font-weight:900;font-size:16px}
@keyframes floatUp{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-46px}}

/* ---------- joystick ---------- */
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(15,29,51,.25);pointer-events:none}
#joyknob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,207,58,.85);border:3px solid var(--ink)}
#tapmark{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--sign);pointer-events:none;animation:tap .5s ease-out forwards}
@keyframes tap{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}

/* ---------- device UX (cross-device layout, view buttons, off-screen indicators) ----------
   --hud-b / --al-h are measured in JS (measureDeviceLayout) so alerts & toasts never sit on top of a wrapped HUD. */
:root{--hud-b:calc(env(safe-area-inset-top,0px) + 56px);--al-h:0px}
button{touch-action:manipulation}
.hbtn{min-height:44px}
.hbtn.ghost{min-width:44px}
.hbtn.ghost.on{background:var(--sky);color:#fff;border-color:var(--ink)}
.card button{min-height:44px}
#alerts{top:calc(var(--hud-b) + 6px)}
#toast{top:calc(var(--hud-b) + 8px)}
#hint{width:max-content}   /* use the full max-width instead of shrinking to half the screen */
#safeprobe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#edge{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.edge{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;padding:0;border-radius:50%;border:3px solid var(--coral);
  background:var(--paper);color:var(--ink);display:grid;place-items:center;font-size:21px;line-height:1;pointer-events:auto;touch-action:none;
  box-shadow:0 3px 0 rgba(15,29,51,.55);will-change:transform}
.edge .ic{display:block;animation:edgePop 1.1s ease-in-out infinite}
.edge.info{border-color:var(--sky)}
.edge.stock{border-color:#ff9f43}
.edge .ar{position:absolute;left:50%;top:50%;width:0;height:0;margin:-6px 0 0 -8px;border:8px solid transparent;border-top:0;border-bottom:12px solid var(--coral);transform-origin:8px 6px}
.edge.info .ar{border-bottom-color:var(--sky)}
.edge.stock .ar{border-bottom-color:#ff9f43}
.edge .n{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--sign);font-family:var(--f-display);font-size:11px;
  display:grid;place-items:center;padding:0 4px}
.edge .n:empty{display:none}
@keyframes edgePop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
/* narrow portrait phones: alerts become one wrapped row under the HUD; toasts go below them */
@media (max-width:540px){
  .hud-l,.hud-r{gap:6px}
  .stars{font-size:13px;letter-spacing:0}
  #ratenum{font-size:12px}
  .hbtn .cnt{font-size:11px;padding:2px 5px}
  #alerts{flex-direction:row;flex-wrap:wrap;right:max(10px,env(safe-area-inset-right,0px));gap:4px}
  #alerts .al{font-size:12px;padding:3px 8px}
  #toast{top:calc(var(--hud-b) + var(--al-h) + 10px)}
  #toast div{font-size:14px}
}
/* short landscape phones: slimmer HUD and hint so the store stays visible */
@media (max-height:500px){
  #hud{padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
  .chip{padding:3px 10px}
  .money b{font-size:17px}
  .day{min-width:96px;padding:3px 10px}
  .hbtn{font-size:14px;padding:4px 10px}
  #alerts .al{font-size:12px;padding:2px 8px}
  #hint{font-size:13px;line-height:1.35;padding:6px 12px;border-width:2px;box-shadow:0 3px 0 var(--ink);
    bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-width:min(480px,calc(100% - 160px))}
  #toast div{font-size:13px;padding:5px 12px}
  #joy{width:100px;height:100px;margin:-50px 0 0 -50px}
  #joyknob{width:44px;height:44px;margin:-22px 0 0 -22px}
  .edge{width:44px;height:44px;margin:-22px 0 0 -22px;font-size:19px}
}
/* tablets & desktop: a touch larger */
@media (min-width:768px) and (min-height:700px){
  .money b{font-size:22px}
  .day .row{font-size:14px}
  .hbtn{font-size:16px}
  #hint{font-size:16px}
  #alerts .al{font-size:14px}
}
@media (prefers-reduced-motion:reduce){ .edge .ic{animation:none} }

/* ---------- sheets / screens ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  background:rgba(10,18,32,.55);touch-action:pan-y}
.sheet{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);width:100%;max-width:440px;max-height:100%;overflow:auto;padding:20px;
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.sheet h2{margin:0 0 4px;font-size:22px;font-weight:900;text-wrap:balance}
.sheet .sub{margin:0 0 14px;color:var(--muted);font-size:14px;font-weight:500}
.btn{border:3px solid var(--ink);background:var(--sign);color:var(--ink);font-weight:900;font-size:17px;border-radius:14px;padding:11px 18px;box-shadow:0 4px 0 var(--ink);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff}
.btn.danger{background:var(--coral);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}

/* title */
#title{background:linear-gradient(180deg,rgba(10,18,32,.15) 0%,rgba(10,18,32,.7) 75%)}
#title .sheet{max-width:420px;text-align:left}
.signboard{background:var(--sign);border:3px solid var(--ink);border-radius:14px;padding:14px 16px 12px;margin:-4px 0 14px;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.signboard .zh{font-size:clamp(34px,10vw,44px);font-weight:900;letter-spacing:.06em;line-height:1.05;color:var(--ink)}
.signboard .en{font-family:var(--f-display);font-size:14px;letter-spacing:.12em;color:var(--ink);margin-top:4px;display:flex;justify-content:space-between}
.signboard .en span:last-child{background:var(--ink);color:var(--sign);padding:0 6px;border-radius:5px}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;line-height:1.5}
.howto li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.howto .k{font-size:18px;line-height:1.3;text-align:center}
.clonerow{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.clonerow span{font-size:12px;font-weight:900;border-radius:999px;padding:3px 9px;color:#fff}

/* team */
.team-list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;border:2px solid #e3dccb;border-radius:14px;padding:10px;background:#fff}
.card .av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;border:2px solid var(--ink)}
.card .nm{font-weight:900;font-size:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .lv{font-family:var(--f-display);font-size:11px;font-weight:400;background:var(--ink);color:var(--sign);border-radius:6px;padding:1px 6px}
.card .ds{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.card .wg{font-size:12px;color:var(--ink);font-weight:700;margin-top:2px}
.card button{border:2px solid var(--ink);background:var(--sign);color:var(--ink);font-weight:900;border-radius:10px;padding:8px 10px;font-size:14px;box-shadow:0 3px 0 var(--ink);min-width:78px;line-height:1.2}
.card button small{display:block;font-family:var(--f-display);font-weight:400;font-size:12px}
.card button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.card button.max{background:#e8e2d3}
.walletline{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-weight:900}
.walletline b{font-family:var(--f-display);font-weight:400;font-size:20px}

/* receipt */
.receipt{font-variant-numeric:tabular-nums;font-size:15px;line-height:1.75;background:#fff;border:2px dashed #cfc6b2;border-radius:6px;padding:14px 16px;margin-top:6px}
.receipt .hd{text-align:center;font-weight:900;font-size:16px}
.receipt .hd small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.4}
.receipt hr{border:0;border-top:2px dashed #cfc6b2;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:12px}
.receipt .r.neg span:last-child{color:#c0392b}
.receipt .r.tot{font-weight:900;font-size:17px}
.receipt .r.tot.pos span:last-child{color:#11885f}
.receipt .bar{height:28px;margin-top:10px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:6px 0}
.confirm{margin-top:10px;padding:10px;border-radius:12px;background:#ffe9e7;border:2px solid var(--coral);font-weight:700;font-size:14px}
.confirm .btns{flex-direction:row;margin-top:8px}
/* ---------- audio toggles (pause panel) + juice fx (coin pops) ---------- */
#pause .toggle-row .hbtn{min-width:68px;justify-content:center}
#pause .toggle-row .hbtn[aria-pressed="false"]{background:#e8e2d3;color:var(--muted);box-shadow:0 3px 0 #b9b2a2;border-color:#b9b2a2}
#pause .toggle-row + .toggle-row{border-top:2px dashed #e3dccb}
.coinfx{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;will-change:transform,opacity;
  background:radial-gradient(circle at 35% 30%,#fff6c4 0 18%,#ffd84d 42%,#e6a817 100%);border:2px solid var(--ink);
  font:400 11px/16px var(--f-display);color:var(--ink);text-align:center}
.failflash{position:absolute;inset:0;opacity:0;pointer-events:none;box-shadow:inset 0 0 0 5px rgba(255,72,64,.85),inset 0 0 80px 22px rgba(255,72,64,.6)}
#resStars .rs{display:inline-block}
#resStars .rs.wait{color:#d8d0bf;text-shadow:none}
#resStars .rs.pop{animation:starPop .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes starPop{0%{transform:scale(.25) rotate(-35deg)}55%{transform:scale(1.4) rotate(10deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){ #resStars .rs.pop{animation:none} }

@media (max-width:420px){
  .money b{font-size:17px}
  .chip{padding:5px 9px}
  .day{min-width:96px}
  .hbtn{padding:6px 9px;font-size:14px}
  #hint{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .hbtn.pulse,.tag.shelf.empty .tx{animation:none}
}

/* ---------- order rush: tickets, touch action buttons, level select, prep, results ---------- */
#orders{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 62px);
  display:flex;gap:6px;pointer-events:none;align-items:flex-start}
.tk{flex:0 1 96px;min-width:0;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 rgba(15,29,51,.6);
  padding:3px 5px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;transform:translateY(-14px);opacity:0;transition:transform .25s,opacity .3s}
.tk.in{transform:none;opacity:1}
.tk .ic{font-size:26px;line-height:1.15}
.tk .nm{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tk .st{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tk .bar{width:100%;height:6px;border-radius:3px;background:#e3dccb;overflow:hidden;margin-top:2px}
.tk .bar b{display:block;height:100%;width:100%;background:var(--mint)}
.tk.urgent{animation:tkShake .45s ease-in-out infinite}
.tk.ok{transform:translateY(-22px) scale(1.12);opacity:0;border-color:var(--mint);background:#e6fff6}
.tk.bad{transform:translateY(18px) rotate(-6deg);opacity:0;border-color:var(--coral);background:#ffe9e7}
@keyframes tkShake{0%,100%{transform:none}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
#actions{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;justify-items:center;pointer-events:none}
.act{pointer-events:auto;touch-action:none;border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--f-body);font-weight:900;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0;-webkit-user-select:none;user-select:none}
.act b{font-size:28px;font-weight:400} .act span{font-size:13px}
#btnGrab{width:88px;height:88px;background:var(--sign);grid-column:2;grid-row:1/3}
#btnUse{width:68px;height:68px;background:#fff;grid-column:1;grid-row:2}
#btnUse b{font-size:24px}

</head>
<body>
<canvas id="game" tabindex="0" aria-label="3D 便利商店遊戲畫面"></canvas>
<div id="tags"></div>
<div id="fx"></div>

<div id="hud" hidden>

    <div class="chip money"><b id="money">$0</b></div>

    <button id="btnTeam" class="hbtn" type="button" aria-label="換人操作 (Q)" title="換人操作 (Q)">🔄 <span class="cnt" id="teamCount">老闆</span></button>
    <button id="btnPause" class="hbtn ghost" type="button" aria-label="暫停">❚❚</button>
  </div>
</div>
<div id="orders" aria-live="polite"></div>
<div id="alerts"></div>
<div id="bigmsg" aria-live="assertive"></div>
<div id="actions" hidden>
  <button id="btnSwap" class="act" type="button" aria-label="換人操作"><b>🔄</b></button>
  <button id="btnUse" class="act off" type="button" aria-label="長按做動作"><b>🔪</b><span>—</span></button>
  <button id="btnGrab" class="act" type="button" aria-label="拿起或放下"><b>✋</b><span>拿起</span></button>
</div>
<div id="goals" role="button" aria-label="今日目標（點一下展開或收合）" hidden></div>
<div id="toast"></div>
<div id="hint" class="off"></div>
<div id="joy" hidden><div id="joyknob"></div></div>

      <div class="zh">分身便利店</div>
      <div class="en"><span>CLONE MART</span><span>24H</span></div>
    </div>

      <li><span class="k">🕹️</span><span id="howMove">左手拖曳畫面走路，右下角按鈕拿東西、做動作。</span></li>
      <li><span class="k">🧾</span><span>上方是客人的點單：照步驟做好，送到黃色「出餐」台。越快送小費越多！</span></li>
      <li><span class="k">🔥</span><span>做好的東西放太久會燒焦，再放下去還會起火。地板濕了會滑倒。</span></li>

</div>

</div>

<script>
'use strict';
(function(){
/* =====================================================================
   分身便利店 — CLONE MART 24H
   A 3D convenience-store management game (Three.js). Works with touch,
   mouse and keyboard. The owner (you) plus up to five AI clones run the store.
   ===================================================================== */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const dist2 = (a,b) => Math.hypot(a.x-b.x, a.z-b.z);
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const isTouch = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window);
const LOWQ = isTouch || Math.min(screen.width, screen.height) < 700;

if (!window.THREE) {
  document.body.innerHTML = '<div style="padding:24px;font:16px sans-serif;color:#fff">3D 引擎載入失敗，請確認網路連線後重新整理。</div>';
  return;
}

/* ---------------- game data ---------------- */
const DAY_LEN = 180;              // seconds per business day (07:00 → 23:00)
const OPEN_H = 7, CLOSE_H = 23;
const COFFEE_PRICE = 50, COFFEE_COST = 12, MAX_CUPS = 6, BREW_TIME = 1.8;
const START_MONEY = 400;

const CASHIER_SPOT  = {x:7.75, z:3.3};
const CHECKOUT_SPOT = {x:5.3,  z:3.3};
const COFFEE_SPOT   = {x:8.6,  z:1.5};
const STOCK_SPOT    = {x:8.6,  z:-4.3};
const STOCK_IDLE    = {x:6.6,  z:-4.0};
const GUARD_SPOT    = {x:3.4,  z:5.5};
const DOOR_OUT      = {x:1.25, z:8.4};
const STREET_Z = 9.7;

const SHELVES = [
  {id:'drink',  name:'飲料',   en:'DRINKS', icon:'🥤', price:25, cost:10, max:12, cx:-3,   cz:-6.45, len:8, band:[-6.8,0.8,-5.7,-4.4], spot:{x:-3,  z:-5.0}, weight:5},
  {id:'snack',  name:'零食',   en:'SNACKS', icon:'🍪', price:35, cost:14, max:9,  cx:-5.5, cz:-2.9,  len:4, band:[-7.4,-3.6,-2.3,-1.2], spot:{x:-5.5,z:-1.75}, weight:4},
  {id:'noodle', name:'泡麵',   en:'NOODLE', icon:'🍜', price:45, cost:18, max:9,  cx:0.5,  cz:-2.9,  len:4, band:[-1.4,2.4,-2.3,-1.2], spot:{x:0.5, z:-1.75}, weight:3},
  {id:'daily',  name:'日用品', en:'DAILY',  icon:'🧴', price:60, cost:25, max:9,  cx:-5.5, cz:0.5,   len:4, band:[-7.4,-3.6,1.1,2.3],  spot:{x:-5.5,z:1.75}, weight:2},
  {id:'bento',  name:'便當',   en:'BENTO',  icon:'🍱', price:85, cost:38, max:8,  cx:0.5,  cz:0.5,   len:4, band:[-1.4,2.4,1.1,2.3],   spot:{x:0.5, z:1.75}, weight:3},
];
const SHELF = Object.fromEntries(SHELVES.map(s => [s.id, s]));

const ROLES = [   // the five AI clones, unlocked by total stars; each runs its own recipes when you are not controlling it
  {id:'barista', name:'咖啡分身', icon:'☕', color:0xc98b5a, css:'#c98b5a', need:0,  recipes:['coffee','noodle'],          home:{x:7.9, z:2.0},  desc:'沖咖啡、泡泡麵'},
  {id:'cook',    name:'熱食分身', icon:'🍱', color:0xff9f43, css:'#ff9f43', need:2,  recipes:['bento','oden'],             home:{x:-6.2, z:3.0}, desc:'微波便當、煮關東煮'},
  {id:'griller', name:'烤台分身', icon:'🌭', color:0xff6058, css:'#ff6058', need:4,  recipes:['hotdog','hotdogset'],       home:{x:-7.4, z:2.6}, desc:'烤香腸、夾大亨堡和套餐'},
  {id:'prep',    name:'備料分身', icon:'🔪', color:0x34d6a6, css:'#34d6a6', need:7,  recipes:['fruitcup','onigiri','drink','snack'], home:{x:-3.4, z:2.9}, desc:'切水果、捏飯糰、拿飲料零食'},
  {id:'cleaner', name:'清潔分身', icon:'🧯', color:0x4da3ff, css:'#4da3ff', need:10, recipes:[],                           home:{x:-1.0, z:2.8}, desc:'拖地、丟失敗品、滅火、修理'},
];
const ROLE = Object.fromEntries(ROLES.map(r => [r.id, r]));

/* ---------------- renderer / scene ---------------- */
const canvas = $('#game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, LOWQ ? 1.75 : 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ccfff);
scene.fog = new THREE.Fog(0x8ccfff, 38, 75);
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 200);

const hemi = new THREE.HemisphereLight(0xffffff, 0x8a9bb0, 0.62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.75);

  const v = Math.random();   // product variety: each slot picks one of a few packaging styles
  if (kind==='snack'){
    const c = pick(PCOL);
    if (v < 0.45) for (let i=0;i<3;i++) add(PG.bag, i===1?pick(PCOL):c, rand(-0.12,0.12), 0.17, 0.25-i*0.22, rand(-0.2,0.2));
    else if (v < 0.75) for (let i=0;i<4;i++) add(PG.tube, i%2?c:0xf2f2f2, -0.21+i*0.14, 0.15, 0.12);
    else for (let i=0;i<3;i++) add(PG.cereal, i===2?pick(PCOL):c, -0.12+i*0.12, 0.15, 0.2-i*0.18, 0.15);
  } else if (kind==='noodle'){
    const c = pick([0xff6058,0xffcf3a,0xff9f43,0xf2f2f2,0x34d6a6]);
    if (v < 0.6){
      for (const x of [-0.13,0.13]) for (const y of [0.075,0.225]) add(PG.cup, c, x, y, 0.15);
      add(PG.cup, c, 0, 0.075, -0.15);
    } else for (const x of [-0.15,0.15]) for (const y of [0.05,0.15,0.25]) add(PG.bowl, y===0.15?0xf2f2f2:c, x, y, 0.08);
  } else if (kind==='daily'){
    if (v < 0.5) for (let i=0;i<3;i++){ const c=pick([0x4da3ff,0xf2f2f2,0xf7a8c4,0x34d6a6]); add(PG.bottle,c,-0.15+i*0.15,0.15,0.18); add(PG.pack,pick(PCOL),-0.12+i*0.15,0.14,-0.12); }
    else { const c = pick([0xf7a8c4,0xa9d8ff,0xf2f2f2]); for (const x of [-0.16,0,0.16]) for (const y of [0.065,0.195]) add(PG.roll, 0xfafafa, x, y, 0.12); add(PG.jug, c, -0.1, 0.13, -0.15); add(PG.jug, c, 0.1, 0.13, -0.15); }
  } else if (kind==='drink'){
    if (v < 0.65) for (let i=0;i<4;i++){ const c=pick([0xff6058,0x4da3ff,0x34d6a6,0xffcf3a,0x8b4a2b,0xf2f2f2]); add(PG.bottle,c,-0.24+i*0.16,0.15,0.18); add(PG.cap,0xffffff,-0.24+i*0.16,0.32,0.18); add(PG.bottle,c,-0.24+i*0.16,0.15,-0.05); }
    else { const c = pick([0xff6058,0x4da3ff,0x34d6a6,0xb57cf0,0x2b2b2b]); for (let i=0;i<4;i++) for (const y of [0.07,0.21]) add(PG.can, i%2 && y > 0.1 ? 0xd9dde3 : c, -0.24+i*0.16, y, 0.16); }
  } else if (kind==='bento'){
    for (const z of [0.12,-0.16]){ const c=pick([0xff6058,0x34d6a6,0xffcf3a,0xff9f43]); add(PG.tray,0x2b2b2b,0,0.04,z); add(PG.lid,c,0,0.095,z); add(PG.tray,0x2b2b2b,0,0.13,z); add(PG.lid,c,0,0.185,z); }
  }
  return g;
}

/* shelf-edge price strips: yellow tags with the price, one shared texture per shelf */
function priceRail(sh, parent, ys, z){
  const L = sh.len;
  const tex = canvasTex(256,16,(g,w,h)=>{
    g.fillStyle='#e9edf2'; g.fillRect(0,0,w,h);
    const n = 3;
    for (let i=0;i<n;i++){
      const x = (i+0.5)*w/n - 22;

      g.fillStyle='#14233d'; g.font=`900 ${h*0.8}px ${FONT}`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('$'+sh.price, x+22, h*0.55);
    }
  });
  const m = new THREE.MeshLambertMaterial({map:tex});
  const geo = new THREE.PlaneGeometry(L-0.08, 0.07);
  for (const y of ys){ const p = new THREE.Mesh(geo, m); p.position.set(0, y, z); parent.add(p); }
}

/* ceiling light strips + warm light pools inside, window spill outside; the pools fade in at night */
function buildLighting(){
  // small floating panels hung over the gaps between shelf columns, so they never hide products from the high camera
  const panelM = nightGlow(new THREE.MeshLambertMaterial({color:0xf4efe6, emissive:0xfff0d0, emissiveIntensity:0.35}), 0.35, 1.0);
  const frameM = mat(0x5a6476);
  const panelGeo = new THREE.BoxGeometry(0.36,0.04,1.05), frameGeo = new THREE.BoxGeometry(0.44,0.05,1.13);
  const panel = (x,z,y)=>{
    const f = new THREE.Mesh(frameGeo, frameM); f.position.set(x, y-0.02, z); scene.add(f);
    const p = new THREE.Mesh(panelGeo, panelM); p.position.set(x, y, z); scene.add(p);
  };
  const poolM = glowMat(0xffc983, radialTex(), 0, 0.32);
  for (const z of [-4.45, -1.2, 2.7]){
    for (const x of [-8.7, -2.5, 3.8]) panel(x, z, 3.25);
    for (let x=-7.3; x<3.5; x+=3.6) lightPool(poolM, x, 0.008, z, 4.2, 3.2);
  }
  panel(6.2, -5.2, 3.0);
  lightPool(poolM, 7.6, 0.009, -5.2, 4, 3);
  lightPool(poolM, 7.9, 0.009, 2.7, 3.6, 5);
  // fridge glow on the floor in front of the drinks
  lightPool(glowMat(0x9fd8ff, radialTex(), 0, 0.22), -3, 0.009, -5.6, 8.5, 1.6);
  // light spilling out of the windows / door onto the sidewalk
  lightPool(glowMat(0xffb35c, fadeTex(), 0, 0.36), 0, 0.004, 8.6, 20, 3.2, Math.PI);
  lightPool(glowMat(0xffc070, radialTex(), 0, 0.4), 1.25, 0.005, 7.6, 4.2, 4.4);   // brighter at the open door
  // street-lamp pools
  const lampPoolM = glowMat(0xffe0a0, radialTex(), 0, 0.5);
  for (const x of [-6.5, 7.5]) lightPool(lampPoolM, x+0.8, 0.006, 12.9, 6, 6);
  // sign glow halo under the 24h light box

/* AI-clone hologram look: scanline band + emissive pulse, and the light-beam "materialize" effect while spawnFx > 0 */
const HOLO = {
  band: new THREE.CylinderGeometry(0.44,0.44,0.05,20,1,true),
  beam: new THREE.CylinderGeometry(0.55,0.55,4.2,20,1,true).translate(0,2.1,0),
  spark: new THREE.BoxGeometry(0.07,0.07,0.07),
  disc: new THREE.CircleGeometry(0.7,24).rotateX(-Math.PI/2),
};
const _holoMats = new Map();
function holoMatsFor(color){
  let h = _holoMats.get(color);
  if (!h){
    const o = {color, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide};
    h = {band: new THREE.MeshBasicMaterial(o), beam: new THREE.MeshBasicMaterial(Object.assign({}, o, {map:fadeTex(), blending:THREE.NormalBlending})),
         spark: new THREE.MeshBasicMaterial(Object.assign({}, o, {blending:THREE.NormalBlending})), disc: new THREE.MeshBasicMaterial(Object.assign({map:radialTex()}, o))};
    _holoMats.set(color, h);
  }
  return h;
}
function addHoloFx(ch, color, owner){
  const hm = holoMatsFor(color);
  ch.holo = hm; ch.holoT = Math.random()*5; ch.fxOwner = owner;
  ch.glowMats = [];
  ch.g.traverse(o => { const m = o.material; if (m && m.emissive && m.emissive.getHex() === color && ch.glowMats.indexOf(m) < 0) ch.glowMats.push(m); });
  ch.scan = new THREE.Mesh(HOLO.band, hm.band); ch.g.add(ch.scan);
  const fx = new THREE.Group(); ch.g.add(fx); ch.beam = fx; fx.visible = false;
  fx.add(new THREE.Mesh(HOLO.beam, hm.beam)); fx.add(new THREE.Mesh(HOLO.disc, hm.disc)); fx.children[1].position.y = 0.03;
  ch.sparks = [];
  for (let i=0;i<8;i++){ const s = new THREE.Mesh(HOLO.spark, hm.spark); fx.add(s); ch.sparks.push(s); }
}
function animHolo(ch, dt){
  const t = (ch.holoT += dt), hm = ch.holo;
  const fx = ch.fxOwner && ch.fxOwner.spawnFx > 0 ? ch.fxOwner.spawnFx : 0;
  // scanline sweeping up the body
  const k = (t*0.55) % 1;
  ch.scan.position.y = 0.05 + k*1.5;
  hm.band.opacity = Math.sin(k*Math.PI)*0.55 + fx*0.4;
  // soft pulse + an occasional glitch flicker
  const glitch = ((t*0.37) % 4 < 0.12 && Math.sin(t*90) > 0) ? 0.35 : 0;
  const e = 0.2 + Math.sin(t*3.2)*0.08 + glitch + fx*1.4;
  for (let i=0;i<ch.glowMats.length;i++) ch.glowMats[i].emissiveIntensity = e;
  // materialize beam (counter-scaled so it stays full size while the body grows in)
  const on = fx > 0.001;
  ch.beam.visible = on;
  if (on){
    ch.beam.scale.setScalar(1/Math.max(ch.g.scale.x, 0.01));
    hm.beam.opacity = Math.min(1, fx*1.6)*0.7;
    hm.disc.opacity = Math.min(1, fx*2);
    hm.spark.opacity = Math.min(1, fx*2);
    for (let i=0;i<ch.sparks.length;i++){
      const s = ch.sparks[i], p = (t*0.9 + i/ch.sparks.length) % 1, a = i*2.4 + t*2.5;
      s.position.set(Math.cos(a)*0.42, p*2.6, Math.sin(a)*0.42);
      s.rotation.y = a;
    }
  }
}

function animChar(ch, dt, moving, speed, carrying){
  if (moving) ch.phase += dt*speed*3.4;
  const s = moving ? Math.sin(ch.phase)*0.65 : 0;
  ch.legL.rotation.x = lerp(ch.legL.rotation.x, s, Math.min(1,dt*15));
  ch.legR.rotation.x = lerp(ch.legR.rotation.x, -s, Math.min(1,dt*15));
  const aL = carrying ? -1.25 : -s*0.8, aR = carrying ? -1.25 : s*0.8;
  ch.armL.rotation.x = lerp(ch.armL.rotation.x, aL, Math.min(1,dt*15));
  ch.armR.rotation.x = lerp(ch.armR.rotation.x, aR, Math.min(1,dt*15));
  ch.torso.position.y = 0.8 + (moving ? Math.abs(Math.cos(ch.phase))*0.035 : 0);
  ch.head.position.y = ch.torso.position.y + 0.52;
  ch.carry.visible = !!carrying;
  if (ch.ring) ch.ring.rotation.y += dt*1.5;
  if (ch.holo) animHolo(ch, dt);
}

class Agent {
  constructor(ch, speed){ this.ch=ch; this.g=ch.g; this.pos=ch.g.position; this.path=[]; this.speed=speed; this.moving=false; this.rot=0; this.carrying=false; }
  goTo(x,z){ this.path = findPath(this.pos.x, this.pos.z, x, z); }
  face(r){ this.rot = r; }
  step(dt, manual){
    let moved = !!manual, rem = this.speed*dt;
    while (rem > 0 && this.path.length){
      const p = this.path[0], dx = p.x-this.pos.x, dz = p.z-this.pos.z, d = Math.hypot(dx,dz);
      if (d > 0.001) this.rot = Math.atan2(dx,dz);
      if (d <= rem){ this.pos.x = p.x; this.pos.z = p.z; rem -= d; this.path.shift(); }
      else { this.pos.x += dx/d*rem; this.pos.z += dz/d*rem; rem = 0; }
      moved = true;
    }
    this.moving = moved;
    let diff = this.rot - this.g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    this.g.rotation.y += diff*Math.min(1, dt*12);
    animChar(this.ch, dt, moved, this.speed, this.carrying);
    return this.path.length === 0;
  }
}

const tagLayer = $('#tags'), fxLayer = $('#fx');

let VW = innerWidth, VH = innerHeight;
class Tag {

    this.el.append(this.ic, this.tx, this.bar); tagLayer.appendChild(this.el);

  }
  icon(s){ s = s || ''; if (s !== this._ic){ this._ic = s; this.ic.textContent = s; } return this; }
  text(s){ s = s || ''; if (s !== this._tx){ this._tx = s; this.tx.textContent = s; } return this; }
  setBar(f, color){
    if (f === null || f === undefined){ if (this._bw !== -1){ this._bw = -1; this.bar.style.display = 'none'; } return this; }
    if (this._bw === -1) this.bar.style.display = '';
    const w = Math.round(clamp(f,0,1)*100);
    if (w !== this._bw){ this._bw = w; this.fillEl.style.width = w + '%'; }
    color = color || '#34d6a6';
    if (color !== this._bc){ this._bc = color; this.fillEl.style.background = color; }
    return this;
  }
  cls(name, on){ this.el.classList.toggle(name, !!on); return this; }
  place(x,y,z){
    _v.set(x,y,z).project(camera);
    const vis = _v.z < 1 && Math.abs(_v.x) < 1.2 && Math.abs(_v.y) < 1.2 && (this._ic || this._tx || this._bw !== -1);
    if (vis !== this._vis){ this._vis = vis; this.el.style.display = vis ? '' : 'none'; }
    if (vis) this.el.style.transform = `translate(${((_v.x+1)/2*VW).toFixed(1)}px,${((1-_v.y)/2*VH).toFixed(1)}px) translate(-50%,-100%)`;
  }

}

const hintQ = []; let hintT = 0, hintCur = null;   // a tip whose valid.cond() turns false is cut short (after 1.4 s) so the next one can show
function showHint(t, valid){ hintQ.push({t, valid}); }
function updateHint(dt){
  const el = $('#hint');
  if (hintT > 0){ hintT -= dt; if (hintT < 4.6 && hintCur && hintCur.valid && hintCur.valid.cond && !hintCur.valid.cond()) hintT = 0; if (hintT <= 0) el.classList.add('off'); return; }
  while (hintQ.length && hintQ[0].valid && !hintQ[0].valid()) hintQ.shift();

let actx = null, muted = false;
function initAudio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){ actx = null; } if (actx){ audioBuses(); musicBoot(); } }
function tone(f, dur, type, vol, when, slideTo){

    comp.connect(actx.destination);

/* ---------------- kitchen loops: one voice per station ----------------
   Driven from the music scheduler tick (every 50 ms, no per-frame cost). A loop is 1–2 sources
   → filter → gain → sfx bus; it fades in, is modulated from the tick, and is stopped (not just
   muted) as soon as its station goes idle, the level is paused/ends, or sound is muted. */
const LOOPS = {};
function loopOn(key, vol, build){
  let L = LOOPS[key];
  if (L) return L;
  const t = actx.currentTime, g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.setTargetAtTime(vol, t, 0.05); g.connect(AUD.sfx);
  L = LOOPS[key] = {g, vol, srcs:[], nodes:[], left:0, f:null};
  const filt = (type, f, q) => { const b = actx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(g); L.nodes.push(b); return b; };
  const noise = (type, f, q) => { const b = filt(type, f, q), s = actx.createBufferSource(); s.buffer = AUD.noise; s.loop = true; s.connect(b); L.srcs.push(s); return b; };
  const osc = (type, f, dest) => { const o = actx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(dest); L.srcs.push(o); return o; };
  L.f = build(noise, osc, filt);
  L.left = L.srcs.length;
  for (const s of L.srcs){
    AUD.live++; AUD.made++;
    s.onended = () => { AUD.live--; try { s.disconnect(); } catch(e){} if (--L.left === 0){ try { L.nodes.forEach(n => n.disconnect()); g.disconnect(); } catch(e){} } };
    s.start(t, s.buffer ? Math.random()*0.9 : 0);

}
function loopOff(key){

  try { const t = actx.currentTime; L.g.gain.cancelScheduledValues(t); L.g.gain.setTargetAtTime(0.0001, t, 0.05); for (const s of L.srcs) s.stop(t + 0.3); } catch(e){}
}

  grill:   (n) => n('highpass', 2600, 0.7),     // sizzle
  pot:     (n) => n('lowpass', 260, 0.9),       // simmer rumble (+ bubble blips from the tick)
  hotwater:(n) => n('bandpass', 600, 3),        // pour: band rises as the cup fills
  coffee:  (n) => n('bandpass', 1500, 1.4),     // grinder, then drips
  fire:    (n) => n('lowpass', 750, 0.6),       // roar (+ crackles from the tick)
  spray:   (n) => n('highpass', 1400, 0.6),     // extinguisher hiss
};

    let fires = 0;
    for (const sl of SLOTS){
      if (sl.fire){ fires++; continue; }
      if (sl.kind !== 'appl' || !sl.item || sl.broken) continue;
      const it = sl.item, inR = APPL[sl.id].ins[it.type];
      if (inR){ want[sl.id] = clamp(it.cook/inR.t, 0, 1); continue; }
      const outR = applOutRule(sl.id, it.type);
      if (outR && outR.burn){
        const b = it.cook/outR.burn;
        if (b < 1) want[sl.id] = 1 + b;                                  // still on the heat: keeps humming/sizzling/bubbling
        if (b > 0.4 && b < 1){                                           // burn warning: beeps speed up toward the burn
          const k = (b - 0.4)/0.6, gap = lerp(0.7, 0.14, k);
          if (!(AUD.beepAt[sl.id] > now - gap)){ AUD.beepAt[sl.id] = now; SFX.burnBeep(k); }
        }
      }
    }
    if (fires) want.fire = fires;
    if (AUD.spray.until > now) want.spray = AUD.spray.me ? 1 : 0.5; else AUD.spray.me = false;
    // the most urgent ticket ticks like a clock, faster as it runs out
    let fmin = 1;

  }

  for (const k in want){
    const v = want[k], L = loopOn(k, LOOP_VOL[k], LOOP_BUILD[k]), r = Math.random();
    if (k === 'micro') loopLevel(L, 0.85 + 0.3*r, 0.05);

    else if (k === 'pot'){ loopLevel(L, 0.6 + 0.4*Math.min(v, 1)); if (r < 0.3 + 0.25*Math.min(v, 1)){ const f = rand(150, 300); tone(f, 0.07, 'sine', 0.05, Math.random()*0.05, f*2.4); } }
    else if (k === 'hotwater'){ L.f.frequency.setTargetAtTime(500 + 1500*Math.min(v, 1), now, 0.1); loopLevel(L, 0.75 + 0.5*r, 0.02); if (Math.random() < 0.12) tone(rand(220, 330), 0.06, 'sine', 0.04, Math.random()*0.05, 160); }
    else if (k === 'coffee'){
      if (v < 0.45){ L.f.frequency.setTargetAtTime(rand(1100, 1900), now, 0.01); loopLevel(L, 0.5 + 0.8*r, 0.008); }                     // grinding
      else { loopLevel(L, 0.12, 0.08); if (r < 0.3) tone(rand(1250, 1500), 0.06, 'sine', 0.035, Math.random()*0.05, 700); }              // dripping
    }
    else if (k === 'fire'){ loopLevel(L, Math.min(1.6, 0.7 + 0.3*v)*(0.75 + 0.5*r), 0.04); for (let i=0;i<Math.min(v, 3);i++) if (Math.random() < 0.45) sfxNoise(Math.random()*0.05, rand(0.008, 0.03), rand(0.04, 0.11), 'hp'); }
    else if (k === 'spray') loopLevel(L, v*(0.85 + 0.3*r), 0.02);

}

/* ---------------- music engine: procedural lo-fi "store radio" loop ----------------
   Original material: 4-bar progressions, swung 8th-note grid, seeded pentatonic melody that
   regenerates every two phrases. Lookahead scheduler (setInterval 50 ms, 0.3 s ahead).
   Day: 86 BPM with soft boom-bap kit. Night (>=19:00, and the calm menu radio): 70 BPM, darker
   filter, pad-like chords, almost no drums. Countdown/play: full; paused: ducked; title/menus: quiet
   and calm (title only after a gesture, since there is no AudioContext before one); ending/results:
   fades out. Rush: in the last 30 s of a timed level the tempo climbs ~16%, the filter opens and
   the kit doubles up (four-on-the-floor kick, 16th hats, octave bass). */
const MUSIC = {
  day:  {bpm:86, cut:2600, swing:0.17, vol:1,
    prog:[[41,[53,57,60,64]], [45,[55,60,64,69]], [46,[57,62,65,69]], [48,[55,58,62,65]]],   // Fmaj7 Am7 Bbmaj7 C9sus4
    scale:[65,67,69,72,74,77,79], dens:0.34,
    kick:[1,0,0,0.6,0,0.45,0,0], rim:[0,0,1,0,0,0,1,0.3], hat:[0.7,0.35,0.6,0.35,0.7,0.35,0.6,0.45]},
  night:{bpm:70, cut:1300, swing:0.12, vol:0.8,
    prog:[[38,[53,57,60,64]], [34,[57,62,65,69]], [43,[53,58,62,69]], [45,[55,62,64,69]]],   // Dm9 Bbmaj7 Gm9 A7sus4
    scale:[62,65,67,69,72,74], dens:0.15,
    kick:[0.7,0,0,0,0,0,0,0], rim:[0,0,0,0,0,0,0.45,0], hat:[0,0.25,0,0.2,0,0.25,0,0.3]},
};
const midiHz = m => 440*Math.pow(2, (m-69)/12);
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function musicMelody(M, seed){
  const r = mulberry(seed), n = M.scale.length, out = new Array(32).fill(-1);
  let idx = n >> 1;
  for (let i=0;i<16;i++){
    const dens = (i%2 ? M.dens*0.45 : M.dens) * (i%8 === 0 ? 1.5 : 1);
    if (r() < dens){ idx = clamp(idx + Math.round((r()-0.5)*4.2), 0, n-1); out[i] = idx; }
  }
  for (let i=16;i<24;i++) out[i] = out[i-16];                                    // bar 3 answers bar 1
  for (let i=24;i<32;i+=2) if (r() < M.dens*0.7){ idx = clamp(idx - 1 + Math.round(r()), 0, n-1); out[i] = idx; }
  return out;
}
function musicIsNight(){ return G.state === 'title' || G.state === 'menu' || G.demo || hourNow() >= 19; }
function musicTarget(){
  if (!musicOn || document.hidden) return 0;
  const s = G.state;
  if (s === 'play' || s === 'countdown') return 1;
  if (s === 'paused') return 0.28;                  // duck under the pause sheet
  if (s === 'title' || s === 'menu') return 0.38;   // calm radio in the menus
  return 0;                                         // ending, results: fade out (whistle + star dings stay clear)
}
/* 0..1: how deep into the last 30 s of a timed level we are (ramps in over ~3 s) */
function musicRush(){
  const L = G.level;
  if (G.demo || !L || L.endless || !(G.state === 'play' || G.state === 'paused')) return 0;
  return clamp((30 - (L.len - G.time))/3, 0, 1);
}
function musicStep(step, t){
  const i = step & 31, bar = i >> 3, s8 = i & 7;
  const rush = AUD.rush = musicRush();
  if (s8 === 0 || (rush && AUD.mode !== 'day')){                    // mode follows the game at every bar (menu → level is quick)
    AUD.mode = !rush && musicIsNight() ? 'night' : 'day';
    if ((i === 0 && AUD.phrase % 2 === 0) || !AUD.mel || AUD.melMode !== AUD.mode){ AUD.mel = musicMelody(MUSIC[AUD.mode], 1013 + AUD.phrase*7919 + (AUD.mode === 'night' ? 31 : 0)); AUD.melMode = AUD.mode; }
    if (i === 0) AUD.phrase++;
  }
  if (i % 8 === 0) AUD.mfilter.frequency.setTargetAtTime(MUSIC[AUD.mode].cut*(1 + 0.7*rush), t, rush ? 0.4 : 1.5);
  const M = MUSIC[AUD.mode], v = M.vol;
  AUD.bpm = M.bpm*(1 + 0.16*rush);
  const beat = 60/AUD.bpm, sd = beat/2;
  if (s8 % 2) t += M.swing*sd;
  const [root, chord] = M.prog[bar], night = AUD.mode === 'night';
  const out = AUD.mfilter;
  // chords: soft electric-piano strike (day re-strikes on the "and" of 2)
  if (s8 === 0 || (!night && s8 === 3)){
    const strong = s8 === 0, len = strong ? (night ? beat*4.2 : beat*2.8) : beat*0.9;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime((strong ? 0.042 : 0.024)*v, t + (night ? 0.35 : 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    g.connect(out);
    chord.forEach((m, k) => {
      const o = actx.createOscillator(); o.type = night ? 'sine' : 'triangle';
      o.frequency.setValueAtTime(midiHz(m), t); o.detune.setValueAtTime((k%2 ? 6 : -5) + rand(-3,3), t);
      o.connect(g); const st = t + (strong && !night ? k*0.012 : 0);
      o.start(st); o.stop(t + len + 0.05); audTrack(o, g);
    });
  }
  // bass
  if (night){
    if (s8 === 0) audVoice('sine', midiHz(root), t, beat*3.6, 0.11*v, 0.05, out);
    if (s8 === 6) audVoice('sine', midiHz(root + 7), t, beat*0.9, 0.06*v, 0.03, out);
  } else {
    const bn = s8 === 0 ? root : s8 === 3 ? root : s8 === 4 ? root + 7 : s8 === 6 ? root + 12 : 0;
    if (bn) audVoice('triangle', midiHz(bn), t, s8 === 0 ? beat*1.3 : beat*0.45, (s8 === 0 ? 0.13 : 0.085)*v, 0.012, out);
  }
  // drums (rush: kick on every beat, 16th hats, pumping octave bass)
  const kv = rush && s8 % 2 === 0 ? Math.max(M.kick[s8], 0.7*rush) : M.kick[s8], rv = M.rim[s8], hv = M.hat[s8];
  if (rush){
    audNoise(t + sd*0.5, 0.025, 0.03*rush, AUD.hp, 1.2);
    if (s8 % 2) audVoice('square', midiHz(root + 12), t, sd*0.6, 0.03*rush, 0.006, out);
  }
  if (kv){
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
    g.gain.setValueAtTime(0.15*kv*v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.26); audTrack(o, g);
  }
  if (rv) audNoise(t, 0.06, 0.09*rv*v, AUD.bp, 0.8);
  if (hv) audNoise(t, s8 === 7 && !night ? 0.07 : 0.03, 0.035*hv*v, AUD.hp, 1);
  if (Math.random() < 0.22) audNoise(t + Math.random()*sd, 0.006, 0.03, AUD.hp, 0.5);    // vinyl dust
  // melody
  const mi = AUD.mel[i];
  if (mi >= 0){
    let len = 1; while (len < 3 && AUD.mel[(i + len) & 31] < 0) len++;
    audVoice(night ? 'sine' : 'triangle', midiHz(M.scale[Math.min(mi, M.scale.length - 1)]), t, sd*len*0.95 + 0.08, (night ? 0.03 : 0.026)*v, 0.015, out, rand(-4,4));
  }
  AUD.steps++;
}
function musicTick(){
  if (!actx || !AUD.master) return;
  try { kitchenAudio(); } catch(e){ loopsOff(); }
  const now = actx.currentTime, want = musicTarget();
  if (want !== AUD.level){
    const wasSilent = AUD.level <= 0;
    AUD.level = want;
    AUD.music.gain.setTargetAtTime(want ? want*MUSIC_VOL : 0.0001, now, want ? (wasSilent ? 0.6 : 0.25) : 0.3);
    if (!want) AUD.stopAt = now + 1.4;
  }
  if (actx.state !== 'running') return;
  if (!want && now > AUD.stopAt){ AUD.next = 0; AUD.step = 0; return; }   // fully faded: stop scheduling
  if (AUD.next < now){ if (AUD.next) AUD.step = (AUD.step + 31) & ~31; AUD.next = now + 0.08; }    // (re)start on a phrase boundary
  try {
    while (AUD.next < now + 0.3){
      musicStep(AUD.step, AUD.next);
      AUD.next += 30/AUD.bpm; AUD.step++;
    }
  } catch(e){ AUD.next = now + 0.5; }
}
function musicBoot(){ if (!AUD.timer && AUD.master) AUD.timer = setInterval(musicTick, 50); }
function syncAudioToggles(){
  const m = $('#btnMusic'), s = $('#btnSound');
  m.textContent = musicOn ? '開' : '關'; m.setAttribute('aria-pressed', String(musicOn));
  s.textContent = muted ? '關' : '開'; s.setAttribute('aria-pressed', String(!muted));
}

/* ---------------- juice: coin pops, squash & stretch, camera shake, money counter ----------------
   All visual-only (never touches simulation). Disabled under prefers-reduced-motion except the
   counter tick-up, which then just flashes instead of popping. */
const RMQ = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
const reducedMotion = () => !!(RMQ && RMQ.matches);
const camShake = new THREE.Vector3();            // additive camera offset, applied at the end of updateCamera
const JUICE = {trauma:0, t:0, squash:[], coins:0, pending:0, shown:null, lastTarget:null, popAt:0, raf:0, last:0, starTok:0, flash:null};
const _jv = new THREE.Vector3();
let moneyB = null, moneyChip = null;
function juiceKick(){ if (!JUICE.raf){ JUICE.last = performance.now(); JUICE.raf = requestAnimationFrame(juiceLoop); } }
function juiceLoop(now){
  const dt = clamp((now - JUICE.last)/1000, 0, 0.05); JUICE.last = now; JUICE.raf = 0;
  if (JUICE.trauma > 0){
    // trauma model: shake = trauma², smooth layered sines, always decays to rest
    JUICE.trauma = Math.max(0, JUICE.trauma - dt*1.7); JUICE.t += dt*26;
    const k = JUICE.trauma*JUICE.trauma*0.34, t = JUICE.t;
    camShake.set(k*(0.6*Math.sin(t*1.7) + 0.4*Math.sin(t*3.1 + 1)), k*0.5*Math.sin(t*2.3 + 2), k*(0.6*Math.sin(t*1.3 + 4) + 0.4*Math.sin(t*2.9)));
  } else camShake.set(0,0,0);
  for (let i = JUICE.squash.length - 1; i >= 0; i--){
    const q = JUICE.squash[i]; q.t += dt;
    const k = q.t/0.42;
    if (k >= 1){ q.g.scale.setScalar(q.base); JUICE.squash.splice(i, 1); continue; }
    const s = 1 + q.amt*(1-k)*(1-k)*Math.cos(k*Math.PI*3);      // stretch → squash → settle
    q.g.scale.set(q.base/Math.sqrt(s), q.base*s, q.base/Math.sqrt(s));
  }
  if (JUICE.trauma > 0 || JUICE.squash.length) JUICE.raf = requestAnimationFrame(juiceLoop);
}
/* squash & stretch on a character (staff member or customer); volume-preserving, returns to rest */
function squash(who, amt){
  if (!who || !who.ch || who.spawnFx > 0 || reducedMotion()) return;
  const g = who.ch.g;
  let q = JUICE.squash.find(e => e.g === g);
  if (!q){ q = {g, base:g.scale.y}; JUICE.squash.push(q); }
  q.t = 0; q.amt = amt || 0.14;
  juiceKick();
}
function camShakeAdd(amount){ if (reducedMotion()) return; JUICE.trauma = Math.min(1, JUICE.trauma + amount); juiceKick(); }
/* coins burst from a world point and fly into the HUD money chip; the counter holds the amount
   until each coin lands, then ticks up with a tink */
function coinBurst(x, y, z, total){
  if (reducedMotion() || !(total > 0)) return;
  if (!moneyB){ moneyB = $('#money'); moneyChip = moneyB.parentElement; }
  const r = moneyB.getBoundingClientRect();
  if (!r.width) return;
  _jv.set(x, y, z).project(camera);
  if (_jv.z > 1) return;
  const sx = (_jv.x+1)/2*VW, sy = (1-_jv.y)/2*VH, tx = r.left + r.width*0.5, ty = r.top + r.height*0.5;
  const n = Math.min(clamp(Math.round(total/35), 2, 7), 28 - JUICE.coins);
  if (n <= 0) return;
  const share = total/n;
  JUICE.pending += total;
  for (let i=0;i<n;i++){
    const c = document.createElement('div'); c.className = 'coinfx'; c.textContent = '$';
    const mx = sx + rand(-70, 70), my = sy - rand(40, 110), delay = i*55 + rand(0, 30), dur = rand(620, 820);
    const tr = (px, py, sc) => `translate(${px.toFixed(1)}px,${py.toFixed(1)}px) scale(${sc})`;
    c.style.transform = tr(sx, sy, 0.4); c.style.opacity = '0';
    fxLayer.appendChild(c); JUICE.coins++;
    try {
      c.animate([
        {transform:tr(sx, sy, 0.4), opacity:0, easing:'cubic-bezier(.2,.7,.4,1)'},
        {transform:tr(mx, my, 1.15), opacity:1, offset:0.38, easing:'cubic-bezier(.55,0,.85,.45)'},
        {transform:tr(tx, ty, 0.55), opacity:0.9}
      ], {duration:dur, delay, fill:'both'});
    } catch(e){}
    setTimeout(() => { c.remove(); JUICE.coins--; JUICE.pending = Math.max(0, JUICE.pending - share); if (JUICE.pending < 0.5) JUICE.pending = 0; SFX.coin(); }, delay + dur);
  }
}
/* HUD money: eased tick toward the real value (minus coins still in flight) + pop on every change */
function moneyDisplay(dt){
  if (!moneyB){ moneyB = $('#money'); moneyChip = moneyB.parentElement; }
  const target = G.money - JUICE.pending;
  if (JUICE.shown === null || G.state === 'title'){ JUICE.shown = target; JUICE.lastTarget = target; }
  if (target !== JUICE.lastTarget){ moneyPop(target > JUICE.lastTarget ? 1 : -1); JUICE.lastTarget = target; }
  const d = target - JUICE.shown;
  JUICE.shown = Math.abs(d) < 0.5 ? target : JUICE.shown + d*Math.min(1, (dt || 0)*9);
  return JUICE.shown;
}
function moneyPop(sign){
  const now = performance.now();
  if (now - JUICE.popAt < 90 || !moneyChip.animate) return;
  JUICE.popAt = now;
  try {
    moneyB.animate([{color: sign > 0 ? '#fffbe0' : '#ff6058'}, {color:'#ffcf3a'}], {duration: sign > 0 ? 300 : 500, easing:'ease-out'});
    if (!reducedMotion()) moneyChip.animate([{transform:'scale(1)'}, {transform: sign > 0 ? 'scale(1.14)' : 'scale(0.94)', offset:0.3}, {transform:'scale(1)'}],
      {duration:260, easing:'ease-out'});
  } catch(e){}
}
/* event bundles (one-line hooks at the event sites) */
function juiceCheckout(who, total){ squash(who, 0.2); coinBurst(CHECKOUT_SPOT.x + 0.7, 1.5, CHECKOUT_SPOT.z, total); }
function juiceCatch(staffer, thief, total){ squash(thief, 0.26); squash(staffer, 0.14); camShakeAdd(0.55); coinBurst(thief.agent.pos.x, 1.6, thief.agent.pos.z, total); }
/* fire: a heavier shake + buzz (the alarm is SFX.fire) */
function juiceFire(){ if (G.demo) return; camShakeAdd(0.5); haptic(30); }
/* delivered ticket: mint flash + the dish icon pops (bigger with the combo) while the ticket flies off */
function juiceTicket(o, combo){

    const ic = el.querySelector('.ic');

}
/* failed ticket: quick red flash around the screen edge (gentler, still visible, under reduced motion) */
function juiceFail(){
  if (!JUICE.flash){ JUICE.flash = document.createElement('div'); JUICE.flash.className = 'failflash'; fxLayer.appendChild(JUICE.flash); }
  if (!JUICE.flash.isConnected) fxLayer.appendChild(JUICE.flash);

/* results: the earned stars land one by one with a bounce and a climbing ding each */
function juiceStars(n){

function addSlot(o){
  Object.assign(o, {item:null, fire:null, broken:0, fix:0, reach:o.reach || 1.45});
  o.tag = new Tag('slot');
  SLOTS.push(o); SLOT[o.id] = o;
  return o;
}
function slotNearest(sl, p){
  if (sl.band){ const b = sl.band; return {x:clamp(p.x,b[0],b[1]), z:clamp(p.z,b[2],b[3])}; }
  return {x:sl.x, z:sl.z};
}
function slotDist(sl, p){ const q = slotNearest(sl, p); return Math.hypot(q.x-p.x, q.z-p.z); }
function placeOnSlot(sl, it){
  sl.item = it; scene.add(it.mesh);
  it.mesh.position.set(sl.x, sl.y, sl.z); it.mesh.rotation.set(0, sl.ry || 0, 0); it.mesh.scale.setScalar(1);
}
function takeFromSlot(sl){ const it = sl.item; sl.item = null; return it; }

/* ---------------- kitchen fx: pooled particles, rings, station animation ----------------
   Two fixed-size point pools (soft alpha for smoke/steam/foam/water, additive for flames/sparks),
   one draw call each, no per-frame allocation. kfxUpdate(dt) runs once per rendered frame and reads
   the game state (slots, fires, spills, held items) to decide what to emit — gameplay code only calls
   kfxSpray() from sprayFx. prefers-reduced-motion: far fewer particles, no rings. */
const KFX = (() => {
  const MAX = LOWQ ? 240 : 420;
  const U = {uScale:{value:400}};
  const VS = 'attribute vec4 pcol; attribute float psize; uniform float uScale; varying vec4 vCol; varying float vStar;\n' +
    'void main(){ vCol = pcol; vStar = psize < 0.0 ? 1.0 : 0.0; vec4 mv = modelViewMatrix*vec4(position,1.0);\n' +
    ' gl_PointSize = abs(psize)*uScale/max(0.1, -mv.z); gl_Position = projectionMatrix*mv; }';
  const FS = 'varying vec4 vCol; varying float vStar;\n' +
    'void main(){ vec2 d = gl_PointCoord - 0.5; float r = length(d)*2.0;\n' +
    ' float a = clamp(1.0 - r*r, 0.0, 1.0); a *= a;\n' +
    ' if (vStar > 0.5){ vec2 q = abs(d)*2.0; float rays = max(0.0, 1.0 - q.x*6.0)*(1.0 - q.y) + max(0.0, 1.0 - q.y*6.0)*(1.0 - q.x); a = max(a*a*1.3, rays); }\n' +
    ' if (a < 0.01) discard; gl_FragColor = vec4(vCol.rgb, vCol.a*a); }';
  const F = n => new Float32Array(n);
  function pool(blend, order){
    const p = {n:0, pos:F(MAX*3), col:F(MAX*4), size:F(MAX), vel:F(MAX*3), life:F(MAX), max:F(MAX), s0:F(MAX), s1:F(MAX),
      c0:F(MAX*3), c1:F(MAX*3), a0:F(MAX), drag:F(MAX), grav:F(MAX), star:new Uint8Array(MAX)};
    const geo = new THREE.BufferGeometry();
    p.aPos = new THREE.BufferAttribute(p.pos, 3); p.aCol = new THREE.BufferAttribute(p.col, 4); p.aSize = new THREE.BufferAttribute(p.size, 1);
    for (const a of [p.aPos, p.aCol, p.aSize]) a.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('position', p.aPos); geo.setAttribute('pcol', p.aCol); geo.setAttribute('psize', p.aSize);
    geo.setDrawRange(0, 0); p.geo = geo;
    const m = new THREE.ShaderMaterial({uniforms:U, vertexShader:VS, fragmentShader:FS, transparent:true, depthWrite:false, blending:blend});
    p.pts = new THREE.Points(geo, m); p.pts.frustumCulled = false; p.pts.renderOrder = order; scene.add(p.pts);
    return p;
  }
  const SOFT = pool(THREE.NormalBlending, 6), GLOW = pool(THREE.AdditiveBlending, 7);
  // colours (linear 0..1 triples), shared — never allocated per emit
  const C = {
    white:[1,1,1], steam:[0.86,0.9,0.96], smokeD:[0.16,0.15,0.15], smokeL:[0.5,0.5,0.52], grey:[0.62,0.62,0.64], greyL:[0.82,0.82,0.84],
    flameY:[1,0.86,0.32], flameR:[1,0.28,0.04], ember:[1,0.62,0.18], gold:[1,0.84,0.3], goldW:[1,0.97,0.75],
    foam:[1,1,1], foamB:[0.72,0.86,1], water:[0.55,0.8,1], waterL:[0.85,0.95,1], spark:[0.75,0.9,1], bubble:[0.98,0.9,0.72],
  };
  function emit(p, x, y, z, vx, vy, vz, life, s0, s1, c0, c1, a, drag, grav, star){
    if (p.n >= MAX) return;
    const i = p.n++, k = i*3;
    p.pos[k] = x; p.pos[k+1] = y; p.pos[k+2] = z; p.vel[k] = vx; p.vel[k+1] = vy; p.vel[k+2] = vz;
    p.life[i] = 0; p.max[i] = life; p.s0[i] = s0; p.s1[i] = s1; p.a0[i] = a; p.drag[i] = drag; p.grav[i] = grav; p.star[i] = star ? 1 : 0;
    p.c0[k] = c0[0]; p.c0[k+1] = c0[1]; p.c0[k+2] = c0[2]; p.c1[k] = c1[0]; p.c1[k+1] = c1[1]; p.c1[k+2] = c1[2];
    p.size[i] = 0; p.col[i*4+3] = 0;
  }
  function kill(p, i){
    const j = --p.n; if (i === j) return;
    const ki = i*3, kj = j*3;
    for (let q=0;q<3;q++){ p.pos[ki+q] = p.pos[kj+q]; p.vel[ki+q] = p.vel[kj+q]; p.c0[ki+q] = p.c0[kj+q]; p.c1[ki+q] = p.c1[kj+q]; }
    p.life[i] = p.life[j]; p.max[i] = p.max[j]; p.s0[i] = p.s0[j]; p.s1[i] = p.s1[j]; p.a0[i] = p.a0[j]; p.drag[i] = p.drag[j]; p.grav[i] = p.grav[j]; p.star[i] = p.star[j];
  }
  function step(p, dt){
    let i = 0;
    while (i < p.n){
      const life = p.life[i] + dt;
      if (life >= p.max[i]){ kill(p, i); continue; }
      p.life[i] = life;
      const k = i*3, t = life/p.max[i], dr = Math.max(0, 1 - p.drag[i]*dt);
      p.vel[k] *= dr; p.vel[k+1] = p.vel[k+1]*dr + p.grav[i]*dt; p.vel[k+2] *= dr;
      p.pos[k] += p.vel[k]*dt; p.pos[k+1] += p.vel[k+1]*dt; p.pos[k+2] += p.vel[k+2]*dt;
      if (p.pos[k+1] < 0.02){ p.pos[k+1] = 0.02; p.vel[k+1] = 0; }
      const s = p.s0[i] + (p.s1[i] - p.s0[i])*t;
      p.size[i] = p.star[i] ? -s : s;
      const c = i*4;
      p.col[c] = p.c0[k] + (p.c1[k] - p.c0[k])*t; p.col[c+1] = p.c0[k+1] + (p.c1[k+1] - p.c0[k+1])*t; p.col[c+2] = p.c0[k+2] + (p.c1[k+2] - p.c0[k+2])*t;
      p.col[c+3] = p.a0[i]*Math.min(1, t*7)*(1 - t);
      i++;
    }
    p.geo.setDrawRange(0, p.n);
    if (p.n || p.was){ p.aPos.needsUpdate = true; p.aCol.needsUpdate = true; p.aSize.needsUpdate = true; }
    p.was = p.n > 0;
  }
  // expanding ground/counter rings (splash, ding, ignition)
  const ringGeo = new THREE.RingGeometry(0.82, 1, 36).rotateX(-Math.PI/2);
  const rings = [];
  for (let i=0;i<6;i++){
    const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0, depthWrite:false, side:THREE.DoubleSide}));
    m.visible = false; m.renderOrder = 5; scene.add(m); rings.push({m, t:0, dur:1, r0:0.1, r1:1, a:1});
  }
  function ring(x, y, z, r0, r1, dur, color, a){
    let best = rings[0]; for (let i=0;i<rings.length;i++){ const r = rings[i]; if (!r.m.visible){ best = r; break; } if (r.t/r.dur > best.t/best.dur) best = r; }
    best.t = 0; best.dur = dur; best.r0 = r0; best.r1 = r1; best.a = a;
    best.m.material.color.setHex(color); best.m.position.set(x, y, z); best.m.visible = true;
  }
  function stepRings(dt){
    for (let i=0;i<rings.length;i++){ const r = rings[i]; if (!r.m.visible) continue;
      r.t += dt; const t = r.t/r.dur; if (t >= 1){ r.m.visible = false; continue; }
      const e = 1 - (1-t)*(1-t); r.m.scale.setScalar(r.r0 + (r.r1 - r.r0)*e); r.m.material.opacity = r.a*(1 - t); }
  }
  return {SOFT, GLOW, C, emit, step, ring, stepRings, U};
})();
const _kv = new THREE.Vector3();
const KST = {t:0, rm:1, mwOn:0, grOn:0, bellT:0, passT:0, stats:null, deliv:0};
const krand = (a, b) => a + Math.random()*(b - a);
function kacc(o, key, rate, dt){ const v = (o[key] || 0) + rate*dt; const n = Math.floor(v); o[key] = v - n; return n; }
function kfxSteam(x, y, z, n, big){
  const P = KFX.SOFT, C = KFX.C;
  for (let i=0;i<n;i++) KFX.emit(P, x + krand(-0.05,0.05), y, z + krand(-0.05,0.05), krand(-0.06,0.06), krand(0.3,0.5), krand(-0.06,0.06), krand(1.0,1.5), big ? 0.14 : 0.1, big ? 0.5 : 0.38, C.steam, C.white, 0.55, 0.6, 0.05);
}
function kfxSmoke(x, y, z, n, dark, a){
  const P = KFX.SOFT, C = KFX.C;

function pickRecipe(){
  const lv = G.level, pool = lv.rec;
  // avoid a whole board of the same thing
  const counts = {}; for (const o of orders) counts[o.rec] = (counts[o.rec]||0) + 1;
  const w = pool.map(r => 1/(1 + (counts[r]||0)*1.5));
  let t = w.reduce((a,b)=>a+b,0)*Math.random(), i = 0;
  while (t > w[i]){ t -= w[i]; i++; }
  return pool[Math.min(i, pool.length-1)];
}

/* ---------------- AI clones ---------------- */
// Each clone handles its own recipes: claim the oldest unclaimed ticket, then run a plan of steps.
const PLANS = {
  drink:   [['take','drink']],
  snack:   [['take','snack']],
  coffee:  [['take','cups'], ['put','coffee'], ['wait','coffee','coffee']],
  noodle:  [['take','noodlesrc'], ['put','hotwater'], ['wait','hotwater','noodle']],
  bento:   [['take','bentosrc'], ['put','micro'], ['wait','micro','bento']],
  oden:    [['take','odensrc'], ['put','pot'], ['wait','pot','oden']],
  hotdog:  [['take','sausagesrc'], ['put','grill'], ['wait','grill','sausage_cooked'], ['take','bunsrc']],
  fruitcup:[['take','fruitsrc'], ['put','board'], ['chop','board'], ['take','board']],
  onigiri: [['take','ricesrc'], ['take','norisrc']],
  hotdogset:[['take','sausagesrc'], ['put','grill'], ['wait','grill','sausage_cooked'], ['take','bunsrc'], ['take','drink']],
};
function aiReset(s){
  const ai = s.ai;
  if (ai && ai.claim){ ai.claim.claim = null; }
  s.ai = {pause:0.4};
}
function aiAt(s, spot){ return !s.agent.path.length && Math.hypot(s.agent.pos.x-spot.x, s.agent.pos.z-spot.z) < 0.45; }
function aiGo(s, spot){
  const ai = s.ai;
  if (aiAt(s, spot)) return true;
  if (ai.dest !== spot || (!s.agent.path.length && (ai.retry = (ai.retry||0) - aiDt) <= 0)){ ai.dest = spot; ai.retry = 0.8; s.agent.goTo(spot.x, spot.z); }
  return false;
}
function aiFace(s, sl){ const q = slotNearest(sl, s.agent.pos); s.agent.face(Math.atan2(q.x - s.agent.pos.x, q.z - s.agent.pos.z)); }
let aiDt = 1/60;
function aiChoose(s){
  const r = ROLE[s.role]; if (!r) return;
  // a held item with no job: deliver it if someone wants it, else bin it
  if (s.hold){
    if (s.hold.type === 'ext'){ s.ai.plan = [['put','extstand']]; s.ai.i = 0; return; }
    if (orders.some(o => RECIPES[o.rec].item === s.hold.type)){ s.ai.plan = [['deliver','pass']]; s.ai.i = 0; return; }
    s.ai.plan = [['bin','trash']]; s.ai.i = 0; return;
  }
  if (r.id === 'cleaner' || r.fixer){
    const fire = SLOTS.find(sl => sl.fire);
    const ext = fire && SLOTS.find(sl => sl.item && sl.item.type === 'ext');   // wherever it was left (not in someone's hand)
    if (ext){ s.ai.plan = [['take', ext.id], ['spray', fire.id], ['put','extstand']]; s.ai.i = 0; return; }
    const broken = SLOTS.find(sl => sl.broken);
    if (broken){ s.ai.plan = [['fix', broken.id]]; s.ai.i = 0; return; }
    const burnt = SLOTS.find(sl => sl.item && sl.item.type === 'burnt' && !sl.fire);
    if (burnt){ s.ai.plan = [['take', burnt.id], ['bin','trash']]; s.ai.i = 0; return; }
    if (r.id === 'cleaner'){
      if (spills.length){ let bd = 1e9, b = null; for (const sp of spills){ const d = dist2(sp, s.agent.pos); if (d < bd){ bd = d; b = sp; } } s.ai.plan = [['mop', b]]; s.ai.i = 0; return; }
      return;
    }
  }
  let pickO = null;
  for (const o of orders){ if (o.claim || !r.recipes.includes(o.rec) || (o.tut && s !== owner)) continue; if (!pickO || o.id < pickO.id) pickO = o; }
  if (!pickO) return;
  pickO.claim = s; s.ai.claim = pickO;
  s.ai.plan = PLANS[pickO.rec].concat([['deliver','pass']]); s.ai.i = 0;
}
function aiUpdate(s, dt){
  aiDt = dt;
  const ai = s.ai;
  if (s.spawnFx > 0){ s.spawnFx = Math.max(0, s.spawnFx - dt*1.8); s.ch.g.scale.setScalar(1.12*(1 - s.spawnFx*s.spawnFx)); }
  if (s.role === 'owner'){ s.prog = null; return; }   // the owner only moves when you control it
  if (ai.pause > 0){ ai.pause -= dt; return; }
  if (ai.claim && orders.indexOf(ai.claim) < 0){ ai.claim = null; if (ai.plan && ai.i < ai.plan.length - 1){ ai.plan = null; } }
  if (!ai.plan){ aiChoose(s); if (!ai.plan){ aiIdle(s, dt); return; } ai.t = 0; }
  const step = ai.plan[ai.i];
  if (!step){ aiReset(s); return; }
  ai.t = (ai.t || 0) + dt;
  if (ai.t > 22){ aiReset(s); return; }
  const [op, ref, want] = step;
  const next = () => { ai.i++; ai.t = 0; ai.pause = CLONE_THINK; if (ai.i >= ai.plan.length){ ai.plan = null; if (ai.claim){ ai.claim.claim = null; ai.claim = null; } } };
  s.prog = null;
  if (op === 'mop'){
    const sp = ref; if (spills.indexOf(sp) < 0){ next(); return; }
    if (!aiGo(s, sp)) return;
    s.prog = useTick(s, dt); if (spills.indexOf(sp) < 0) next();
    return;
  }
  const sl = SLOT[ref]; if (!sl){ aiReset(s); return; }
  if (!aiGo(s, sl.spot)) return;
  aiFace(s, sl);
  switch (op){
    case 'take':
      if (sl.fire && !(sl.item && sl.item.type === 'ext')) return;
      if (s.hold && sl.kind !== 'src'){ aiReset(s); return; }
      if (sl.kind !== 'src' && !sl.item){ aiReset(s); return; }
      if (grab(s, sl)) next(); else aiReset(s);
      break;
    case 'put':
      if (!s.hold){ aiReset(s); return; }
      if (sl.fire || sl.broken) return;
      if (sl.item){ if (ai.t > 12) aiReset(s); return; }
      if (grab(s, sl)) next(); else aiReset(s);
      break;
    case 'wait':
      if (!sl.item){ aiReset(s); return; }
      if (sl.broken){ ai.t = 0; if ((ROLE[s.role] || {}).fixer && findTarget(s) === sl) s.prog = useTick(s, dt); return; }   // don't give up (and leave the food to burn once repaired) while the machine is out; a fixer repairs it
      if (sl.item.type === 'burnt'){ grab(s, sl); ai.plan = [['bin','trash']]; ai.i = 0; if (ai.claim){ ai.claim.claim = null; ai.claim = null; } return; }
      if (sl.item.type === want && !s.hold){ if (grab(s, sl)) next(); }
      break;
    case 'chop':
      if (!sl.item){ aiReset(s); return; }
      if (sl.item.type !== 'fruit'){ next(); return; }
      s.prog = useTick(s, dt);
      break;
    case 'deliver':
      if (!s.hold){ next(); return; }
      if (orders.some(o => RECIPES[o.rec].item === s.hold.type)){ grab(s, sl); next(); }
      else if (ai.t > 4){ ai.plan = [['bin','trash']]; ai.i = 0; }
      break;
    case 'bin':
      if (s.hold) grab(s, sl);
      next();
      break;
    case 'spray':
      if (!sl.fire){ next(); return; }
      s.prog = useTick(s, dt);
      if (!sl.fire) next();
      break;
    case 'fix':
      if (!sl.broken){ next(); return; }
      s.prog = useTick(s, dt);
      break;
  }
}
function aiIdle(s, dt){
  const r = ROLE[s.role];
  if (r && r.home) aiGo(s, r.home);
}

function actionNear(x, y){

    const r = el.getBoundingClientRect(); if (!r.width) continue;
    const d = Math.hypot(x - (r.left + r.right)/2, y - (r.top + r.bottom)/2) - r.width/2;

/* ---------------- day / night ---------------- */
const SKY = [[7,0x9fd3ff],[11,0x8ccfff],[15,0x9fd0f5],[17,0xf7c98b],[18.5,0xf08a5d],[19.6,0x3b4f86],[21,0x1a2a4d],[23,0x0f1d33]];
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
const _nightTint = new THREE.Color();
function skyAt(h){
  for (let i=0;i<SKY.length-1;i++){
    if (h <= SKY[i+1][0]){ const t = clamp((h-SKY[i][0])/(SKY[i+1][0]-SKY[i][0]),0,1); return _c1.setHex(SKY[i][1]).lerp(_c2.setHex(SKY[i+1][1]), t); }
  }

}
function applyTimeOfDay(h){
  const c = skyAt(h);

  const night = clamp((h-18)/2.2, 0, 1);
  const dusk = clamp(1 - Math.abs(h-18)/1.5, 0, 1);

  hemi.intensity = lerp(0.52, 0.44, night);

  // outside sinks into a cool blue night while the store stays lit
  _nightTint.setRGB(lerp(1, 0.3, night), lerp(1, 0.36, night), lerp(1, 0.52, night));
  for (const m of outdoorMats){ m.color.copy(m.userData.base).multiply(_nightTint); }
  for (const m of lampMats){ m.emissiveIntensity = night*1.2; }
  storeLight.intensity = night*0.85;

}

function targetLabelHTML(s, sl, g, u){
  const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
  const nm = type => (ITEMS[type] && ITEMS[type].n) || '';

    const h = s.hold;

    else if (g === '拿起') v = '拿 ' + nm(sl.item ? sl.item.type : sl.give);
    else if (g === '放下') v = '放到' + sl.n;

    else if (g === '夾起來' && h){ const r = combine(h.type, sl.give); v = r ? '夾成 ' + nm(r) : g; }
    else if (g === '組合' && h && sl.item){ const r = combine(h.type, sl.item.type); v = r ? '組成 ' + nm(r) : g; }

function showScreen(name){ for (const k in screens) screens[k].hidden = k !== name; }
function openPanel(name){

function lvIndex(id){ return LEVELS.findIndex(L => L.id === id); }
function bestOf(i){ const L = LEVELS[i]; return (L && G.best[L.id]) || {score:0, stars:0, crown:false}; }
function chapterStars(ch){ let t = 0; LEVELS.forEach((L, k) => { if (L.ch === ch) t += bestOf(k).stars; }); return t; }
// the level as played on a difficulty (a shallow copy; LEVELS stays untouched)
function effLevel(L, diffId){
  const D = DIFF(diffId || G.diff);
  return Object.assign({}, L, {base:L, diff:D.id, timeMul:D.time, every:[L.every[0]*D.every, L.every[1]*D.every],
    clones:Math.min(5, L.clones + D.slots), stars:L.stars.map(t => Math.max(10, Math.round(t*D.star/10)*10))});
}
function lvLabel(i){
  const L = LEVELS[i]; if (!L) return '';
  if (L.endless) return '無限營業';
  const same = LEVELS.filter(x => x.ch === L.ch && !x.endless);
  return '第 ' + L.ch + '-' + (same.indexOf(L) + 1) + ' 關';
}
function chapterGate(i){ const L = LEVELS[i], C = L && !L.req && CHAPTER(L.ch); return C && C.need && LEVELS.findIndex(x => x.ch === L.ch && !x.endless) === i ? C.need : 0; }   // ★ the previous chapter needs, for a chapter's first level
function levelUnlocked(i){
  const L = LEVELS[i]; if (!L) return false;
  if (L.req){ const j = lvIndex(L.req.lv); return j >= 0 && bestOf(j).stars >= (L.req.stars || 1); }
  const same = []; LEVELS.forEach((x, k) => { if (x.ch === L.ch && !x.endless) same.push(k); });
  const pos = same.indexOf(i);
  if (pos > 0) return bestOf(same[pos-1]).stars >= 1;
  const C = CHAPTER(L.ch), ci = CHAPTERS.indexOf(C);
  if (!C || ci <= 0 || !C.need) return true;
  return chapterStars(CHAPTERS[ci-1].id) >= C.need;
}
function applyDiffToMachines(k){   // scale burn / fire timers for the difficulty (keeps the base values)
  for (const id in APPL){
    const a = APPL[id];
    if (!('_fire' in a)) a._fire = a.fire;
    if (a._fire) a.fire = a._fire*k;
    for (const t in a.ins){ const r = a.ins[t]; if (!('_burn' in r)) r._burn = r.burn; if (r._burn) r.burn = r._burn*k; }
  }
}

/* ---------------- cosmetics registry (shop items your staff can wear) ----------------
   slot: 'hat' | 'face' | 'back'. build() returns an Object3D placed in the character's local space (feet at y=0,
   head centre at y≈1.32, facing +z). G.equip[roleId][slot] = cosmetic id ('owner' for you). */
const COSMETICS = [
  {id:'hat_chef', n:'廚師高帽', slot:'hat',  price:150, ic:'👨‍🍳', build(){ const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.15,0.26,14), mat(0xffffff)); b.position.y = 1.66; const t = new THREE.Mesh(new THREE.SphereGeometry(0.21,14,10), mat(0xffffff)); t.position.y = 1.82; g.add(b, t); return g; }},
  {id:'hat_cat',  n:'貓耳髮箍', slot:'hat',  price:220, ic:'🐱',   build(){ const g = new THREE.Group(); for (const x of [-0.13,0.13]){ const e = new THREE.Mesh(new THREE.ConeGeometry(0.07,0.16,4), mat(0x333344)); e.position.set(x,1.6,0); g.add(e); } return g; }},
  {id:'face_glasses', n:'圓框眼鏡', slot:'face', price:120, ic:'👓', build(){ const g = new THREE.Group(); for (const x of [-0.075,0.075]){ const r = new THREE.Mesh(new THREE.TorusGeometry(0.05,0.012,6,14), mat(0x222222)); r.position.set(x,1.34,0.215); g.add(r); } return g; }},
];
const COSMETIC = id => COSMETICS.find(c => c.id === id);
function applyCosmetics(s){
  if (!s || !s.ch) return;
  const want = (G.equip && G.equip[s.role]) || {}, ch = s.ch;
  ch.cos = ch.cos || {};
  for (const slot of new Set(['hat','face','back'].concat(COSMETICS.map(c => c.slot), Object.keys(ch.cos)))){   // also slots added by new cosmetics
    const id = want[slot] || null;
    if ((ch.cos[slot] && ch.cos[slot].id) === id) continue;
    if (ch.cos[slot]){ ch.g.remove(ch.cos[slot].obj); ch.cos[slot] = null; }
    const c = id && COSMETIC(id);
    if (c && c.build){ const obj = c.build(); obj.traverse(o => { if (o.isMesh) o.castShadow = true; }); ch.g.add(obj); ch.cos[slot] = {id, obj}; }
  }
}
