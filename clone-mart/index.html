/* ---------------- day flow ---------------- */
function clearDayEntities(){
  while (customers.length) removeCustomer(customers[0]);
  queue.length = 0;
  while (messes.length) removeMess(messes[0]);
}
function rentFor(day){ return 150 + 50*(day-1) + 8*(day-1)*(day-1); }   // quadratic term: late days need upgrades, not just clones
function endDay(){
  G.state = 'summary';
  clearDayEntities();
  SFX.close();
  const wages = ROLES.reduce((s,r)=>s + (G.clones[r.id] ? r.wage : 0), 0);
  const rent = rentFor(G.day);
  const goalRows = finishGoals();
  addMoney(-(wages + rent));
  const S = G.stats;
  const profit = S.revenue - S.stockCost - S.coffeeCost - wages - rent + S.bonus;
  const stars = '★★★★★'.slice(0, Math.round(G.rating)) + '☆☆☆☆☆'.slice(0, 5-Math.round(G.rating));
  const row = (a,b,cls) => `<div class="r ${cls||''}"><span>${a}</span><span>${b}</span></div>`;
  $('#sumTitle').textContent = '第 ' + G.day + ' 天打烊了！';
  $('#receipt').innerHTML =
    `<div class="hd">分身便利店 CLONE MART<small>營業日報 · 第 ${G.day} 天 · 07:00–23:00${G.event && G.event.id !== 'normal' ? ' · ' + G.event.icon + ' ' + G.event.name : ''}</small></div><hr>` +
    row('來客數', S.customers + ' 人') + row('結帳完成', S.served + ' 人') + row('賣出商品', S.items + ' 件') +
    (S.vip ? row('👑 VIP 結帳', S.vipServed + ' / ' + S.vip + ' 人', S.vipServed < S.vip ? 'neg' : '') : '') +
    (S.missed ? row('缺貨撲空', S.missed + ' 次', 'neg') : '') +
    row('氣走客人', S.angry + ' 人', S.angry ? 'neg' : '') + row('抓到小偷', S.caught + ' 人') + row('被偷走', S.stolen + ' 次', S.stolen ? 'neg' : '') + goalRows + '<hr>' +
    row('營業收入', fmt(S.revenue)) + row('進貨成本', '-' + fmt(S.stockCost), 'neg') + row('咖啡豆', '-' + fmt(S.coffeeCost), 'neg') +
    row('分身薪資', '-' + fmt(wages), wages ? 'neg' : '') + row('店租', '-' + fmt(rent), 'neg') +
    (S.bonus ? row('目標獎金', '+' + fmt(S.bonus)) : '') + '<hr>' +
    row('本日淨利', (profit < 0 ? '-' : '') + fmt(Math.abs(profit)), 'tot ' + (profit >= 0 ? 'pos' : 'neg')) +
    row('現金餘額', fmt(G.money), 'tot') + row('顧客評價', stars + ' ' + G.rating.toFixed(1)) +
    `<div class="bar"></div>`;
  const broke = G.money < 0, hated = G.rating < 0.5;
  $('#btnNext').textContent = broke ? '付不出錢了…' : hated ? '沒有客人想再來了…' : '迎接第 ' + (G.day+1) + ' 天';
  $('#btnNext').onclick = () => { if (broke) gameOver('bankrupt'); else if (hated) gameOver('rating'); else nextDay(); };
  if (!broke && !hated){ G.day++; G.time = 0; save(); G.day--; }
  showScreen('summary');
}
function nextDay(){
  G.day++; G.time = 0; G.spawnT = 2; G.closingT = 0; G.stats = newStats();
  planDay();
  for (const s of staff){ s.ai = {}; s.carry = false; s.agent.carrying = false; s.agent.path.length = 0; }
  save();
  showScreen(null); G.state = 'play';
  toast('第 ' + G.day + ' 天開店！明天的店租 ' + fmt(rentFor(G.day)), 'good');
  if (G.event.id !== 'normal'){ toast('今天是' + G.event.icon + ' ' + G.event.name + '：' + G.event.desc, ''); tip('event', '有些日子會有特別活動（' + G.event.icon + ' ' + G.event.name + '：' + G.event.desc + '），右上方的目標欄會標出來。'); }
  if (G.day === 2) showHint('從今天開始會出現小偷 🕶️，記得在他們出門前攔下來。');
  if (G.day === 3) showHint('從今天開始會有戴金帽的 👑 VIP：付 1.5 倍的錢，但更沒耐心。');
}
function gameOver(kind){
  G.state = 'over';
  clearDayEntities();
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
  $('#overTitle').textContent = kind === 'bankrupt' ? '付不出店租，店舖倒閉了' : '評價跌到谷底，店舖倒閉了';
  $('#overText').textContent = `你撐了 ${G.day} 天，僱用了 ${ROLES.filter(r=>G.clones[r.id]).length} 個 AI 分身。再來一次，試著早點讓分身幫忙！`;
  showScreen('over');
}

/* ---------------- goals, events & store upgrades ---------------- */
// Each day gets 3 goals (one per group: volume / skill / quality) and, from day 4, maybe a day event.
// Both come from a per-run seed + day number, so reloading a save never rerolls them.
const GOAL_DEFS = [
  {id:'serve',   grp:0, from:1, type:'up',   label:t=>`結帳 ${t} 位客人`,  target:d=>Math.min(70, 11+4*d), val:()=>G.stats.served},
  {id:'revenue', grp:0, from:2, type:'up',   label:t=>`營收 ${fmt(t)}`,    target:d=>Math.min(7000, Math.round((1200+350*d)/50)*50), val:()=>G.stats.revenue, money:true},
  {id:'coffee',  grp:1, from:1, type:'up',   label:t=>`賣出 ${t} 杯咖啡`,  target:(d,ev)=>Math.min(24, Math.round((3+1.3*d)*(ev.coffee ? Math.min(1.5, ev.coffee/0.28) : 1))), val:()=>G.stats.coffeeSold, ok:ev=>ev.id !== 'heat'},
  {id:'catch',   grp:1, from:2, type:'up',   label:t=>`抓到 ${t} 個小偷`,  target:d=>Math.min(3, 1+Math.floor(d/6)), val:()=>G.stats.caught},
  {id:'vip',     grp:1, from:3, type:'up',   label:t=>`服務 ${t} 位 VIP`,  target:d=>Math.min(3, 1+Math.floor(d/5)), val:()=>G.stats.vipServed},
  {id:'noAngry', grp:2, from:1, type:'zero', label:()=>'零氣走客人',      target:()=>0, val:()=>G.stats.angry},
  {id:'noTheft', grp:2, from:2, type:'zero', label:()=>'沒有東西被偷',    target:()=>0, val:()=>G.stats.stolen},
  {id:'rating',  grp:2, from:2, type:'end',  label:t=>`打烊評價 ≥ ${t.toFixed(1)}★`, target:d=>d < 6 ? 3.5 : 4, val:()=>G.rating},
];
const goalReward = d => Math.round((40 + 12*d)/10)*10;
function mulberry32(a){ return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const newUpg = () => Object.fromEntries(STORE_UPG.map(u => [u.id, 0]));
function upgFx(id){ const u = STORE[id]; return u.fx[clamp((G.upg && G.upg[id]) || 0, 0, u.fx.length-1)]; }
for (const sh of SHELVES) sh.baseMax = sh.max;
function applyUpgrades(){ const f = upgFx('shelf'); for (const sh of SHELVES) sh.max = Math.round(sh.baseMax*f); }
G.upg = newUpg(); G.seed = 1; G.event = DAY_EVENTS[0]; G.goals = []; G.rush = null;

function planDay(){
  const rng = mulberry32((G.seed|0)*7919 + G.day*104729);
  let ev = DAY_EVENTS[0];
  if (G.day >= 4 && rng() < 0.55) ev = DAY_EVENTS[1 + Math.floor(rng()*(DAY_EVENTS.length-1))];
  G.event = ev; G.rush = null;
  G.goals = [];
  for (let grp=0; grp<3; grp++){
    const pool = GOAL_DEFS.filter(g => g.grp === grp && G.day >= g.from && (!g.ok || g.ok(ev)));
    if (!pool.length) continue;
    const def = pool[Math.floor(rng()*pool.length)];
    G.goals.push({id:def.id, def, target:def.target(G.day, ev), done:false, fail:false, paid:0});
  }
  goalsDirty = true; goalsPeekT = 8;
}
function demandMult(){
  return (G.rush && G.state === 'play' ? RUSH_MULT(G.day) : 1) * ((G.event && G.event.spawn) || 1) * upgFx('sign');
}
function completeGoal(g){
  g.done = true; goalsDirty = true;
  const r = goalReward(G.day); g.paid = r;
  addMoney(r); G.stats.bonus += r; addRating(0.1);
  if (G.state === 'play' || G.state === 'closing'){ toast('🎯 目標達成：' + g.def.label(g.target) + ' +' + fmt(r), 'good'); SFX.hire(); }
}
function updateGoals(dt){
  if (G.state === 'play'){
    const h = hourNow();
    const r = RUSHES.find(x => h >= x.from && h < x.to) || null;
    if (r !== G.rush){
      G.rush = r; goalsDirty = true;
      if (r){
        toast(r.icon + ' ' + r.name + '來了！客人變多', 'bad');
        tip('rush', '尖峰時段客人會一口氣湧進來：先把貨補滿、多沖幾杯咖啡。');
        G.spawnT = Math.min(G.spawnT, 0.8);   // the rush starts now, not after the slower pre-rush timer
      }
    }
    if (G.time > 4) tip('goals', '右上方是「今日目標」，達成就有獎金和評價加分！');
  } else if (G.rush){ G.rush = null; goalsDirty = true; }
  for (const g of G.goals){
    if (g.done || g.fail) continue;
    const v = g.def.val();
    if (g.def.type === 'up' && v >= g.target) completeGoal(g);
    else if (g.def.type === 'zero' && v > 0){ g.fail = true; goalsDirty = true; toast('✗ 目標失敗：' + g.def.label(g.target), 'bad'); }
  }
}
// called from endDay: settle the remaining goals, pay the all-clear bonus, return receipt rows
function finishGoals(){
  for (const g of G.goals){
    if (g.done || g.fail) continue;
    const v = g.def.val();
    if ((g.def.type === 'zero' && v === 0) || (g.def.type === 'end' && v >= g.target - 1e-9)) completeGoal(g);
    else g.fail = true;
  }
  goalsDirty = true;
  if (!G.goals.length) return '';
  const row = (a,b,cls) => `<div class="r ${cls||''}"><span>${a}</span><span>${b}</span></div>`;
  let html = '<hr>' + row('🎯 今日目標', G.goals.filter(g=>g.done).length + ' / ' + G.goals.length, 'tot');
  for (const g of G.goals) html += row((g.done ? '✓ ' : '✗ ') + g.def.label(g.target), g.done ? '+' + fmt(g.paid) : '未達成', g.done ? '' : 'neg');
  if (G.goals.every(g => g.done)){
    const r = goalReward(G.day); addMoney(r); G.stats.bonus += r;
    html += row('🎉 全部達成獎勵', '+' + fmt(r));
  }
  return html;
}

/* goals HUD (right column, placed under the top bar). On small screens it folds into a one-line
   chip and only "peeks" open for a few seconds when something changes; tapping it pins it open/closed. */
const goalsEl = $('#goals');
let goalsDirty = true, goalsT = 0, goalsRows = [], goalsOpen = null, goalsPeekT = 0, goalsMini = null;
const shortMoney = n => n >= 1000 ? '$' + (Math.floor(n/100)/10) + 'k' : '$' + Math.round(n);
goalsEl.addEventListener('click', () => { goalsOpen = goalsEl.classList.contains('mini'); goalsPeekT = 0; goalsT = 0; });
function updateGoalsHUD(dt){
  const hide = $('#hud').hidden || G.state === 'title' || !G.goals.length;
  if (goalsEl.hidden !== hide) goalsEl.hidden = hide;
  if (hide) return;
  if (goalsPeekT > 0) goalsPeekT -= dt;
  goalsT -= dt;
  if (goalsT > 0 && !goalsDirty) return;
  goalsT = 0.25;
  const top = Math.round($('#hud').getBoundingClientRect().bottom + 8) + 'px';
  if (goalsEl.style.top !== top) goalsEl.style.top = top;
  if (goalsDirty){
    goalsDirty = false; goalsPeekT = Math.max(goalsPeekT, 4);
    const ev = G.event && G.event.id !== 'normal' ? `<div class="ev">${G.event.icon} ${G.event.name}</div>` : '';
    const rush = G.rush ? `<div class="ev rush">${G.rush.icon} ${G.rush.name}中</div>` : '';
    goalsEl.innerHTML = `<div class="gh"><span>🎯 今日目標</span><span class="rw">每項 +${fmt(goalReward(G.day))}</span><span class="sm">${G.goals.filter(g => g.done).length}/${G.goals.length} ▾</span></div>` + (ev || rush ? `<div class="evs">${ev}${rush}</div>` : '') +
      G.goals.map(g => `<div class="g${g.done ? ' done' : g.fail ? ' fail' : ''}"><span class="ck">${g.done ? '✓' : g.fail ? '✗' : '○'}</span><span class="lb">${g.def.label(g.target)}</span><span class="v"></span>${g.def.type === 'up' ? '<i><b></b></i>' : ''}</div>`).join('');
    const els = goalsEl.querySelectorAll('.g');
    goalsRows = G.goals.map((g,i) => ({g, v:els[i].querySelector('.v'), b:els[i].querySelector('b'), _v:null, _w:null}));
  }
  const small = innerWidth < 600 || innerHeight < 480;
  const mini = goalsOpen === null ? small && goalsPeekT <= 0 : !goalsOpen;
  if (mini !== goalsMini){ goalsMini = mini; goalsEl.classList.toggle('mini', mini); goalsEl.setAttribute('aria-expanded', String(!mini)); }
  for (const r of goalsRows){
    const g = r.g, d = g.def, val = d.val();
    let t, w = null;
    if (d.type === 'zero') t = g.done ? '達成' : g.fail ? '失敗' : '撐到打烊';
    else if (d.type === 'end') t = (Math.round(val*10)/10).toFixed(1) + '★';
    else { const v = Math.min(val, g.target); t = d.money ? shortMoney(v) + '/' + shortMoney(g.target) : v + '/' + g.target; w = Math.round(v/g.target*100); }
    if (t !== r._v){ r._v = t; r.v.textContent = t; }
    if (r.b && w !== r._w){ r._w = w; r.b.style.width = w + '%'; }
  }
}

/* store upgrades (rendered at the bottom of the team panel) */
function buyUpgrade(id, quiet){
  const u = STORE[id], lv = (G.upg && G.upg[id]) || 0;
  if (!u || lv >= u.cost.length || G.money < u.cost[lv]) return false;
  addMoney(-u.cost[lv]); G.upg[id] = lv+1; applyUpgrades();
  if (!quiet){ SFX.hire(); toast(u.icon + ' ' + u.name + ' 升到 LV' + (lv+1), 'good'); }
  if (!screens.team.hidden) renderTeam();
  save();
  return true;
}
function renderStoreUpgrades(list){
  let sec = $('#storeUpg');
  if (!sec){ sec = document.createElement('div'); sec.id = 'storeUpg'; list.after(sec); }
  sec.innerHTML = '<h3 class="upg-h">店鋪升級</h3><p class="upg-sub">一次付清、永久有效，不用付薪水。</p>';
  const grid = document.createElement('div'); grid.className = 'team-list'; sec.appendChild(grid);
  for (const u of STORE_UPG){
    const lv = G.upg[u.id] || 0, maxLv = u.cost.length;
    const card = document.createElement('div'); card.className = 'card';
    const av = document.createElement('div'); av.className = 'av'; av.style.background = '#ffe7a0'; av.textContent = u.icon;
    const mid = document.createElement('div'); mid.style.minWidth = '0';
    const eff = lv ? '目前 ' + u.fxText(u.fx[lv]) + (lv < maxLv ? ' → 下一級 ×' + u.fx[lv+1] : '') : '升級後 ' + u.fxText(u.fx[1]);
    mid.innerHTML = `<div class="nm">${u.name}${lv ? `<span class="lv">LV${lv}</span>` : ''}</div><div class="ds">${u.desc}</div><div class="wg">${eff}</div>`;
    const b = document.createElement('button'); b.type = 'button';
    if (lv < maxLv){ const c = u.cost[lv]; b.innerHTML = `${lv ? '升級' : '購買'}<small>${fmt(c)}</small>`; b.disabled = G.money < c; b.onclick = () => buyUpgrade(u.id); }
    else { b.textContent = '滿級'; b.disabled = true; b.className = 'max'; }
    card.append(av, mid, b); grid.appendChild(card);
  }
}

/* ---------------- save / load ---------------- */
function getSaveData(){
  return {v:1, day:G.day, money:G.money, rating:G.rating, cups:G.cups, clones:G.clones, tips:[...G.tips], muted,
    stock:Object.fromEntries(SHELVES.map(s=>[s.id,s.stock])), upg:Object.assign({}, G.upg), seed:G.seed};
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(getSaveData())); } catch(e){} }
function loadSave(){ try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }
function resetWorld(data){
  clearDayEntities();
  for (const s of staff.slice()){ if (s !== player){ scene.remove(s.ch.g); s.tag.remove(); } }
  staff.length = 0; staff.push(player);
  player.carry = false; player.agent.carrying = false; player.agent.path.length = 0;
  player.agent.pos.set(CASHIER_SPOT.x, 0, CASHIER_SPOT.z - 1.2);
  G.day = data ? data.day : 1; G.money = data ? data.money : START_MONEY; G.rating = data ? data.rating : 3;
  G.cups = data ? data.cups : 2; G.clones = data ? Object.assign({}, data.clones) : {};
  G.tips = new Set(data && data.tips ? data.tips : []);
  G.upg = Object.assign(newUpg(), data && data.upg); applyUpgrades();
  G.seed = data && data.seed ? data.seed : 1 + Math.floor(Math.random()*1e6);
  if (data && typeof data.muted === 'boolean') muted = data.muted;
  for (const sh of SHELVES) sh.stock = data && data.stock && data.stock[sh.id] !== undefined ? data.stock[sh.id] : sh.max;
  for (const r of ROLES) if (G.clones[r.id]) spawnClone(r.id, G.clones[r.id], true);
  G.time = 0; G.spawnT = 2; G.closingT = 0; G.stats = newStats();
  planDay();
}
function startGame(data){
  initAudio();
  hintQ.length = 0; hintT = 0; $('#hint').classList.add('off');
  resetWorld(data);
  $('#hud').hidden = false;
  showScreen(null);
  G.state = 'play';
  updateCamera(0, true);
  if (G.day === 1 && !G.tips.has('move')){
    G.tips.add('move');
    showHint(isTouch ? '在畫面上拖曳就能走動，或點一下地板、貨架直接走過去。' : '用 WASD／方向鍵走動，或點地板、貨架直接走過去。滾輪可以縮放。');
  }
  toast('第 ' + G.day + ' 天開店！', 'good');
  canvas.focus({preventScroll:true});
}

/* ---------------- main loop ---------------- */
function spawnInterval(){
  const base = clamp(7.5 - (G.day-1)*0.7, 2.0, 8);
  return base * (1.25 - G.rating*0.08) * demandMult();
}
function simulate(dt){
  curDt = dt;
  G.time += dt;
  if (G.state === 'play'){
    G.spawnT -= dt;
    if (G.spawnT <= 0 && G.time < DAY_LEN - 4){
      G.spawnT = spawnInterval()*rand(0.6,1.4);
      if (customers.length < 16) spawnCustomer();
    }
    if (G.time >= DAY_LEN){ G.state = 'closing'; G.closingT = 0; toast('23:00 打烊囉！服務完店內的客人', ''); }
  } else if (G.state === 'closing'){
    G.closingT += dt;
    if (customers.length === 0 || G.closingT > 30){ endDay(); return; }
  }
  reg.power = 0; coffee.power = 0;
  updatePlayer(dt);
  for (const s of staff) if (s !== player) updateClone(s, dt);
  for (const s of staff) staffWork(s, dt);
  for (const c of customers.slice()) updateCustomer(c, dt);
  updateRegister(dt);
  updateGoals(dt);
  // mess reduces reputation slowly
  if (messes.length) addRating(-0.0025*messes.length*dt);
  // shelf tags
  for (const sh of SHELVES){
    if (sh.shown !== sh.stock){ sh.shown = sh.stock; sh.slots.forEach((s,i)=>{ s.visible = i < sh.stock; }); }
    if (sh.stock === 0) sh.tag.text('缺貨！').icon(sh.icon).cls('empty', true);
    else if (sh.stock <= Math.ceil(sh.max*0.34)) sh.tag.text(sh.stock + '/' + sh.max).icon('').cls('empty', false);
    else sh.tag.text('').icon('').cls('empty', false);
    if (sh.stock <= 2) tip('restock', '貨架快空了！先到倉庫「拿貨」格子拿箱子，再走到貨架前就會自動補滿。');
  }
  stockTag.icon(SHELVES.some(s=>s.stock <= Math.ceil(s.max*0.34)) && !player.carry ? '📦' : '').text('');
  // door
  let near = false;
  for (const c of customers) if (Math.abs(c.agent.pos.x-1.25) < 2 && Math.abs(c.agent.pos.z-7) < 1.8){ near = true; break; }
  if (!near) for (const s of staff) if (Math.abs(s.agent.pos.x-1.25) < 2 && Math.abs(s.agent.pos.z-7) < 1.8){ near = true; break; }
  door.open = clamp(door.open + (near ? dt*3 : -dt*2), 0, 1);
  door.L.position.x = 0.625 - door.open*1.1; door.R.position.x = 1.875 + door.open*1.1;
  // staff tags
  for (const s of staff){
    if (s === player){
      s.tag.icon(s.carry ? '📦' : '').text('你').setBar(s.prog, '#34d6a6');
    } else {
      const r = ROLE[s.role];
      s.tag.icon(s.greetT > 0 ? '👋' : r.icon).text('').setBar(s.prog, '#34d6a6');
    }
  }
  for (const m of messes) m.tag.setBar(m.prog > 0 ? m.prog : null, '#34d6a6');
}
function placeTags(){
  for (const sh of SHELVES) sh.tag.place(sh.tagPos.x, sh.tagPos.y, sh.tagPos.z);
  regTag.place(6.5, 1.9, 3.3);
  coffeeTag.place(9.6, 2.2, 1.5);
  stockTag.place(8.75, 2.4, -6.1);
  for (const s of staff){ const p = s.agent.pos; s.tag.place(p.x, 2.15, p.z); }
  for (const c of customers){ const p = c.agent.pos; c.tag.place(p.x, 1.95*c.ch.g.scale.y/1.06, p.z); }
  for (const m of messes) m.tag.place(m.x, 0.6, m.z);
}

let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (dt <= 0) return;
  if (G.state === 'play' || G.state === 'closing'){
    // sub-step for stability on slow devices
    const n = dt > 0.05 ? 2 : 1;
    for (let i=0;i<n;i++) if (G.state === 'play' || G.state === 'closing') simulate(dt/n);
    applyTimeOfDay(hourNow());
  } else if (G.state === 'title'){
    applyTimeOfDay(19.2);
    // idle shoppers wander on the title screen for life
    for (const c of customers.slice()) updateCustomer(c, dt);
    G.spawnT -= dt; if (G.spawnT <= 0 && customers.length < 6){ G.spawnT = 3; spawnCustomer(); G.stats.customers = 0; }
    reg.power = 0; coffee.power = 0;
    for (const s of staff) if (s !== player) updateClone(s, dt);
    G.cups = MAX_CUPS;
    staffWork(player, 0); updateRegister(dt);
    player.agent.step(dt);
  }
  const hideTags = G.state === 'title';
  if (tagLayer._hidden !== hideTags){ tagLayer._hidden = hideTags; tagLayer.style.visibility = hideTags ? 'hidden' : ''; }
  updateCamera(dt);
  if (G.state !== 'title') placeTags();
  updateHUD(dt); updateHint(dt);
  renderer.render(scene, camera);
}

function resize(){
  VW = innerWidth; VH = innerHeight;
  renderer.setSize(VW, VH, false);
  updateCamera(0, true);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if (document.hidden && (G.state === 'play' || G.state === 'closing')) openPanel('pause'); });

/* ---------------- buttons ---------------- */
$('#btnTeam').onclick = () => { initAudio(); if (G.state === 'play' || G.state === 'closing') openPanel('team'); };
$('#btnPause').onclick = () => { if (G.state === 'play' || G.state === 'closing') openPanel('pause'); };
$('#btnTeamClose').onclick = closePanels;
$('#btnResume').onclick = closePanels;
$('#btnSound').onclick = () => { muted = !muted; syncAudioToggles(); save(); saveAudioSettings(); initAudio(); SFX.pick(); };
$('#btnMusic').onclick = () => { musicOn = !musicOn; syncAudioToggles(); saveAudioSettings(); initAudio(); SFX.pick(); };
$('#btnRestart').onclick = () => { $('#confirmBox').hidden = false; };
$('#btnRestartNo').onclick = () => { $('#confirmBox').hidden = true; };
$('#btnRestartYes').onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch(e){} startGame(null); };
$('#btnOverRestart').onclick = () => startGame(null);
$('#btnNew').onclick = () => startGame(null);
$('#btnContinue').onclick = () => startGame(loadSave());
for (const id of ['team','pause']) screens[id].addEventListener('pointerdown', e => { if (e.target === screens[id]) closePanels(); });

/* ---------------- boot ---------------- */
function boot(hotData){
  const cr = $('#cloneRow');
  for (const r of ROLES){ const s = document.createElement('span'); s.style.background = r.css; s.textContent = r.icon + ' ' + r.name; cr.appendChild(s); }
  if (!isTouch) $('#howMove').textContent = 'WASD／方向鍵走動，或用滑鼠點地板、貨架直接走過去。';
  buildWorld();
  createPlayer();
  player.agent.pos.set(CASHIER_SPOT.x, 0, CASHIER_SPOT.z); player.agent.face(-Math.PI/2);
  const saved = (hotData && hotData.day) ? hotData : loadSave();
  if (saved && saved.day){
    $('#btnContinue').hidden = false; $('#btnContinue').textContent = '繼續第 ' + saved.day + ' 天';
    $('#btnContinue').onclick = () => startGame(saved);
    $('#btnNew').textContent = '新的店（重新開始）';
  }
  if (saved && typeof saved.muted === 'boolean') muted = saved.muted;
  resize();
  requestAnimationFrame(t => { last = t; frame(t); });
  if (hotData && hotData.day && hotData.inGame) startGame(hotData);
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => Object.assign(getSaveData(), {inGame: G.state !== 'title' && G.state !== 'over'})); } catch(e){}
  // expose a tiny debug/test hook
  window.__cloneMart = {sim(secs){ const n = Math.round(secs*30); for (let i=0;i<n && (G.state==='play'||G.state==='closing');i++) simulate(1/30); return G.state; }, G, SHELVES, customers, queue, messes, staff, startGame, hire, endDay, spawnCustomer, spawnMess};
  Object.assign(window.__cloneMart, {nextDay, upgrade, buyUpgrade, planDay, rentFor, STORE_UPG, DAY_EVENTS, cloneOf});
}
function start(data){
  const fontsReady = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]) : Promise.resolve();
  fontsReady.then(() => boot(data || {}));
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
