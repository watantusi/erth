/* ---------------- save / load ---------------- */
const SAVE_KEY_RUSH = 'clonemart-rush-v1';
function saveProgress(){ try { localStorage.setItem(SAVE_KEY_RUSH, JSON.stringify({v:2, best:G.best, diff:G.diff, coins:G.coins, owned:[...G.owned], equip:G.equip, ach:G.ach, tips:[...G.tips], team:G.team, muted})); } catch(e){} }
function normBestKey(k){ return /^\d+$/.test(k) ? (LEVEL_IDS_V1[+k] || null) : k; }   // v1 saves keyed best by level index
function mergeBest(src){
  if (!src || typeof src !== 'object') return;
  for (const k in src){
    const id = normBestKey(k), b = src[k]; if (!id || !b || !isFinite(b.score) || !isFinite(b.stars)) continue;
    const p = G.best[id] || {score:0, stars:0, crown:false};
    G.best[id] = {score:Math.max(p.score, Math.max(0, b.score|0)), stars:clamp(Math.max(p.stars, b.stars|0), 0, 3), crown:!!(p.crown || b.crown)};
  }
}
function loadProgress(){
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY_RUSH) || 'null'); if (!d) return;
    mergeBest(d.best);
    if (DIFFS.some(x => x.id === d.diff)) G.diff = d.diff;
    if (isFinite(d.coins) && d.coins >= 0) G.coins = Math.floor(d.coins);
    if (Array.isArray(d.owned)) G.owned = new Set(d.owned.filter(x => typeof x === 'string'));
    if (d.equip && typeof d.equip === 'object') G.equip = d.equip;
    if (d.ach && typeof d.ach === 'object') G.ach = d.ach;
    if (Array.isArray(d.tips)) G.tips = new Set(d.tips);
    if (Array.isArray(d.team)) G.team = d.team.filter(id => ROLE[id]);
    if (typeof d.muted === 'boolean') muted = d.muted;
  } catch(e){}
}
function getSaveData(){ return {best:G.best, team:G.team}; }

/* ---------------- main loop ---------------- */
function onSpill(s){ for (const sp of spills) if (Math.hypot(sp.x-s.agent.pos.x, sp.z-s.agent.pos.z) < 0.55) return true; return false; }
function updateMachines(dt){
  for (const sl of SLOTS){
    if (sl.fire){
      const f = sl.fire; f.t += dt; f.hp = Math.min(1, f.hp + dt*0.12);
      f.g.children.forEach((m,i) => { m.scale.set(1, 0.7 + 0.5*Math.abs(Math.sin(f.t*9 + m.userData.ph)), 1); });
      if (sl.isl){
        f.spread += dt;
        if (f.spread > 7){ f.spread = 0; const nb = [ISLAND[sl.islI-1], ISLAND[sl.islI+1]].filter(Boolean).map(id => SLOT[id]).filter(x => !x.fire); if (nb.length) ignite(pick(nb)); }
      }
      continue;
    }
    if (sl.kind !== 'appl' || !sl.item || sl.broken) continue;
    const it = sl.item, a = APPL[sl.id], inR = a.ins[it.type];
    if (inR){ it.cook += dt; if (it.cook >= inR.t){ setItemType(it, inR.out); SFX.done(sl.id); } }
    else {
      const outR = applOutRule(sl.id, it.type);
      if (outR && outR.burn){
        it.cook += dt;
        if (it.cook > outR.burn*0.4) tip('burn', '⚠️ 快燒焦了！做好的東西要趕快從機器拿出來。');
        if (it.cook >= outR.burn){ setItemType(it, 'burnt'); if (!G.demo){ SFX.burnt(); floatText(sl.x, sl.y + 0.8, sl.z, sl.id === 'pot' ? '煮爛了！' : '燒焦了！', 'bad txt'); } }
      } else if (it.type === 'burnt' && a.fire){
        it.cook += dt; if (it.cook >= a.fire) ignite(sl);
      }
    }
  }
}
/* level twists: tutorial script, rush waves, rain bursts, storm blackouts */
function rushNow(){
  const L = G.level; if (!L.rush || G.demo || G.tut >= 0) return null;
  for (const r of L.rush){
    if (r.every){ const k = G.time % r.every; if (G.time >= r.every && k < r.len) return r; }
    else { const a = r.at*L.len; if (G.time >= a && G.time < a + r.len) return r; }
  }
  return null;
}
function rushLeft(r){ const L = G.level; return r.every ? r.len - G.time % r.every : r.at*L.len + r.len - G.time; }
function flashBig(text){
  bigMsg(text, true);
  const h = hud.big.innerHTML;
  setTimeout(() => { if (hud.big.innerHTML === h && G.state !== 'countdown' && G.state !== 'ending') hud.big.innerHTML = ''; }, 1300);
}
function fanfare(){ tone(784, 0.1, 'triangle', 0.08); tone(988, 0.1, 'triangle', 0.08, 0.1); tone(1319, 0.22, 'triangle', 0.08, 0.2); }
function twistTick(dt){
  const L = G.level;
  // tutorial: scripted tickets one at a time; the clock stands still until the last one is done
  if (G.tut >= 0){
    if (!orders.length && G.gapT <= 0){
      if (G.tut < L.script.length){ spawnOrder(L.script[G.tut]); G.tut++; G.gapT = 1.4; }
      else {
        G.tut = -1; G.spawnT = 2.5; G.gapT = 0;
        toast('📘 教學完成！計時開始', 'good'); fanfare();
        tip('tutdone', '教學完成！現在客人會一直來，同時會有好幾張單。照順序先送最舊的單，連擊小費會加倍。');
        if (staff.length > 1) tip('swap', (isTouch ? '按 🔄' : '按 Q 或 Tab') + ' 可以換成操作分身，其他人會繼續自己工作。');
      }
    }
    return;
  }
  // rush waves
  const r = rushNow();
  if (r !== G.rush){
    if (r){ flashBig(r.ic + ' ' + r.name + '！'); fanfare(); camShakeAdd(0.25); G.spawnT = Math.min(G.spawnT, 0.6); G.stats.events++;
      tip('rush', r.ic + ' ' + r.name + '！接下來客人特別多，先做簡單快速的單，別讓點單逾時。'); }
    else if (G.rush){ toast('😮‍💨 ' + G.rush.name + '結束，喘口氣！', 'good'); G.stats.rushDone++; }
    G.rush = r;
  }
  // rain: a group with wet umbrellas walks in → several puddles at once
  if (L.rain){
    G.rainT -= dt;
    if (G.rainT <= 4 && G.warnAt !== 'rain'){ G.warnAt = 'rain'; toast('☔ 外面雨越下越大…', ''); }
    if (G.rainT <= 0){
      G.rainT = L.rain.every*rand(0.85, 1.15); G.warnAt = 0; G.stats.events++;
      G.tips.add('spill');   // the rain tip below covers mopping
      for (let k=0;k<L.rain.n;k++) spawnSpill();
      toast('☔ 一群客人帶著濕雨傘進來，地板濕了！', 'bad'); camShakeAdd(0.15);
      tip('rain', '☔ 地板一次濕了好幾攤！踩到會變慢，空手站在水漬旁長按「動作」拖乾。');
    }
  }
  // storm: a blackout breaks several machines at once
  if (L.storm){
    G.stormT -= dt;
    if (G.stormT <= 4 && G.warnAt !== 'storm'){ G.warnAt = 'storm'; toast('🌀 風雨變強了，燈在閃…', ''); }
    if (G.stormT <= 0){
      G.stormT = L.storm.every*rand(0.85, 1.15); G.warnAt = 0; G.stats.events++;
      flashBig('⚡ 跳電！'); camShakeAdd(0.5);
      G.tips.add('outage');   // the storm tip below covers repairs
      for (let k=0;k<L.storm.n;k++) breakRandomMachine();
      tip('storm', '⚡ 颱風跳電，好幾台機器同時壞掉！空手站在 ⚡ 機器旁長按「動作」修理，先修你現在要用的。');
    }
  }
}
// tips that depend on what is happening right now (each shows once, ever)

function simulate(dt){
  const L = G.level;
  if (G.tut < 0) G.time += dt;   // the tutorial pauses the level clock
  // tickets
  for (const o of orders.slice()){ o.t += dt; if (o.t >= o.limit) failOrder(o); else if (!o._dec || o._bx) decorateTicket(o); }
  G.spawnT -= dt; G.gapT -= dt;
  twistTick(dt);
  const late = !L.endless && G.time > L.len - 8;
  const rush = G.rush, maxB = L.max + (rush ? rush.add : 0);
  const minBoard = Math.min(3, L.max);
  if (G.tut < 0 && !late && orders.length < maxB && G.gapT <= 0 && (G.spawnT <= 0 || orders.length < minBoard)){
    spawnOrder(); G.gapT = rush ? 1.2 : 2.2;
    const ramp = L.endless ? Math.max(0.3, 1 - G.time/450) : 1;   // endless: tickets come faster over time
    G.spawnT = rand(L.every[0], L.every[1])*ramp*(rush ? rush.k : 1);
  }
  // hazards
  G.spillT -= dt; if (G.spillT <= 0){ G.spillT = rand(25, 42)/(L.spills || 1); spawnSpill(); }
  G.outT -= dt; if (G.outT <= 0){ G.outT = L.outage*rand(0.8, 1.2); breakRandomMachine(); }
  updateMachines(dt);
  situationTips();
  updateEventChip();
  // characters
  if (!G.demo && !G.bot) updatePlayer(dt);
  for (const s of staff){
    if (s === player && !G.demo && !G.bot) continue;
    aiUpdate(s, dt);
    s.agent.carrying = !!s.hold;
    s.agent.speed = s.baseSpeed*(onSpill(s) ? 0.55 : 1);
    s.agent.step(dt);
  }
  for (const s of staff){
    s.ch.carry.visible = false;
    if (s.sprayT > 0){ s.sprayT -= dt; if (s.sprayT <= 0 && s.spray) s.spray.visible = false; }
    if (s.hold) for (const m of s.hold.mesh.children) if (m.userData.steam !== undefined){ const k = (G.time*0.8 + m.userData.steam*0.33) % 1; m.position.y = 0.3 + k*0.3; m.material.opacity = 0.5*(1-k); }
  }
  for (const c of customers.slice()) updateCustomer(c, dt);
  // door
  let near = false;
  for (const c of customers) if (Math.abs(c.agent.pos.x-1.25) < 2 && Math.abs(c.agent.pos.z-7) < 1.8){ near = true; break; }
  if (!near) for (const s of staff) if (Math.abs(s.agent.pos.x-1.25) < 2 && Math.abs(s.agent.pos.z-7) < 1.8){ near = true; break; }
  door.open = clamp(door.open + (near ? dt*3 : -dt*2), 0, 1);
  door.L.position.x = 0.625 - door.open*1.1; door.R.position.x = 1.875 + door.open*1.1;
  // staff tags
  for (const s of staff){
    const r = ROLE[s.role];
    s.tag.icon(s.hold ? ITEMS[s.hold.type].ic : (r ? r.icon : '')).text(s === player && !G.demo ? '你' : '').setBar(s.prog, '#34d6a6');
  }
  for (const sp of spills) sp.tag.setBar(sp.prog > 0 ? sp.prog/1.2 : null, '#4da3ff');
  if (!G.demo){
    if (!L.endless && G.time >= L.len) endLevel();
    else if (L.endless && G.fails >= MAX_FAILS_ENDLESS) endLevel();
  }
}
function idleStep(dt){
  for (const s of staff){ s.agent.carrying = !!s.hold; s.agent.step(dt); s.ch.carry.visible = false; }
  for (const c of customers.slice()) updateCustomer(c, dt);
}
function placeTags(){
  for (const sl of SLOTS) sl.tag.place(sl.band ? clamp(player.agent.pos.x, sl.band[0], sl.band[1]) : sl.x, sl.y + 0.75, sl.band ? sl.z : sl.z);
  for (const s of staff){ const p = s.agent.pos; s.tag.place(p.x, 2.15, p.z); }
  for (const c of customers){ const p = c.agent.pos; c.tag.place(p.x, 1.95*c.ch.g.scale.y/1.06, p.z); }
  for (const sp of spills) sp.tag.place(sp.x, 0.6, sp.z);
}

let last = performance.now(), clock = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (dt <= 0) return;
  clock += dt;
  if (G.state === 'play'){
    const n = dt > 0.05 ? 2 : 1;
    for (let i=0;i<n;i++) if (G.state === 'play') simulate(dt/n);
  } else if (G.state === 'title' || G.state === 'menu'){
    simulate(dt);
  } else if (G.state === 'countdown'){
    countdownTick(dt); idleStep(dt);
  } else if (G.state === 'ending'){
    G.endT -= dt; idleStep(dt);
    if (G.endT <= 0) showResults();
  }
  applyTimeOfDay(hourNow());
  const hideTags = G.state === 'title' || G.state === 'menu';
  if (tagLayer._hidden !== hideTags){ tagLayer._hidden = hideTags; tagLayer.style.visibility = hideTags ? 'hidden' : ''; }
  const showAct = isTouch && (G.state === 'play' || G.state === 'countdown');
  if (hud.actions.hidden === showAct) hud.actions.hidden = !showAct;
  updateCamera(dt);
  updateHighlight(clock);
  kfxUpdate(dt);
  if (!hideTags){ updateSlotTags(); placeTags(); }
  updateDeviceUX(dt);
  updateHUD(dt); updateHint(dt);
  renderer.render(scene, camera);
}

function resize(){
  VW = innerWidth; VH = innerHeight;
  renderer.setSize(VW, VH, false);
  if (uxEls.probe) measureDeviceLayout();
  updateCamera(0, true);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') openPanel('pause'); });

/* ---------------- buttons ---------------- */
function switchChar(dir){
  if (G.state !== 'play') return;
  const list = staff.filter(s => s === owner || ROLE[s.role]);
  if (list.length < 2){ toast('這關沒有帶分身', ''); return; }
  const i = list.indexOf(player);
  const nx = list[(i + (dir || 1) + list.length) % list.length];
  if (player !== owner) aiReset(player);
  player.pending = null;
  aiReset(nx); nx.agent.path.length = 0; nx.prog = null;
  if (nx.spawnFx > 0){ nx.spawnFx = 0; nx.ch.g.scale.setScalar(1.12); }   // the pop-in only advances under AI control
  player = nx;
  SFX.pick(); haptic(10); squash(nx, 0.18);
  floatText(nx.agent.pos.x, 2.5, nx.agent.pos.z, '換我！', 'txt');
}
function actGrab(){
  if (G.state !== 'play') return;
  const t = findTarget(player);
  player.pending = null;
  if (!t){ if (player.hold) nope(player, '這裡不能放東西'); return; }
  if (grab(player, t)) haptic(8);
}
$('#btnTeam').onclick = () => { initAudio(); switchChar(1); };
$('#btnPause').onclick = () => openPanel('pause');
$('#btnResume').onclick = closePanels;
$('#btnSound').onclick = () => { muted = !muted; syncAudioToggles(); saveProgress(); saveAudioSettings(); initAudio(); SFX.pick(); };
$('#btnMusic').onclick = () => { musicOn = !musicOn; syncAudioToggles(); saveAudioSettings(); initAudio(); SFX.pick(); };
$('#btnRestart').onclick = () => startLevel(G.lv, G.team);
$('#btnQuit').onclick = () => { $('#hud').hidden = true; showLevels(); };
$('#btnNew').onclick = () => { initAudio(); SFX.pick(); showLevels(); };
$('#btnLvBack').onclick = () => { G.state = 'title'; showScreen('title'); };
$('#btnGo').onclick = () => startLevel(prepLv, prepTeam);
$('#btnPrepBack').onclick = () => showLevels();
$('#btnRetry').onclick = () => startLevel(G.lv, G.team);
$('#btnNextLv').onclick = () => { $('#hud').hidden = true; showPrep(G.lv + 1); };
$('#btnMenu').onclick = () => { $('#hud').hidden = true; showLevels(); };
screens.pause.addEventListener('pointerdown', e => { if (e.target === screens.pause) closePanels(); });
// touch action buttons
const bindHold = (el, down, up) => {
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); initAudio(); if (e.pointerType !== 'mouse') lastInput = 'touch'; el.classList.add('down'); try { el.setPointerCapture(e.pointerId); } catch(_){} down(); });
  const end = e => { el.classList.remove('down'); if (up) up(); };
  el._press = on => { if (on){ initAudio(); el.classList.add('down'); down(); } else end(); };   // used by near-miss touches on the canvas
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
  el.addEventListener('contextmenu', e => e.preventDefault());
};
bindHold(hud.btnGrab, actGrab);
bindHold(hud.btnUse, () => { touchUse = true; }, () => { touchUse = false; });
bindHold(hud.btnSwap, () => switchChar(1));

/* ---------------- boot ---------------- */
function boot(hotData){
  const cr = $('#cloneRow');
  for (const r of ROLES){ const s = document.createElement('span'); s.style.background = r.css; s.textContent = r.icon + ' ' + r.name; cr.appendChild(s); }
  if (!isTouch) $('#howMove').textContent = 'WASD 走路，空白鍵拿起／放下，E 長按做動作，Q 換人。';
  if (isTouch) document.body.classList.add('touch');
  loadProgress();
  if (hotData && hotData.best) mergeBest(hotData.best);   // hot reload: merge the snapshot (getSaveData)
  if (hotData && Array.isArray(hotData.team) && !G.team.length) G.team = hotData.team.filter(id => ROLE[id]);
  buildWorld();
  buildKitchen();
  buildKitchenExtra(); designUI();
  createPlayer();
  buildDeviceUX();
  setupWorld(0, ROLES.map(r => r.id), true);
  resize();
  requestAnimationFrame(t => { last = t; frame(t); });
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => getSaveData()); } catch(e){}
  // test hook
  window.__cloneMart = {
    sim(secs){ const n = Math.round(secs*30); for (let i=0;i<n && G.state === 'play';i++) simulate(1/30); if (G.state === 'ending'){ G.endT = 0; showResults(); } return G.state; },
    G, orders, SLOTS, SLOT, staff, customers, spills, LEVELS, RECIPES, ROLES, ITEMS, PLANS, APPL, COMBOS, MAX_FAILS_ENDLESS, scene, pickables,
    startLevel, setupWorld, endLevel, showResults, showLevels, showPrep, spawnOrder, spawnSpill, ignite, breakRandomMachine, grab, useTick, findTarget, switchChar, actGrab,
    get player(){ return player; }, get owner(){ return owner; }, ROLE, CHAPTERS, DIFFS, COSMETICS, THEMES, effLevel, lvLabel, levelUnlocked, bestOf, applyCosmetics, applyTheme, saveProgress, loadProgress,
    botOwner(on){ G.bot = !!on; if (on){ ROLE.bot = {id:'bot', recipes:ALL_RECIPES.slice(), home:{x:4.2, z:2.4}, fixer:true}; owner.role = 'bot'; } else { owner.role = 'owner'; player = owner; } }, skipCountdown(){ if (G.state === 'countdown'){ G.cdT = 0; countdownTick(0); } },
  };
}
function start(data){
  const fontsReady = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]) : Promise.resolve();
  fontsReady.then(() => boot(data || {}));
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
